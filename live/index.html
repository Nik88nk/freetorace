<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Free to Race Live</title>
<meta name="description" content="Free F1 live timing and track map on your phone. Unofficial fan project.">
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Free to Race">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d12;--panel:#14181f;--panel2:#1b2029;--line:#262c37;--line2:#1d222b;--text:#eef1f6;--dim:#8b94a7;--dim2:#5d6577;
  --accent:#e10600;--purple:#b46cff;--green:#22d36b;--yellow:#ffd12e;--blue:#3d8bff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.35 "Titillium Web","Segoe UI",system-ui,sans-serif}
body{display:flex;flex-direction:column;overflow:hidden}
.tn{font-variant-numeric:tabular-nums}
.dim{color:var(--dim)}
header{padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;background:#08090d;border-bottom:3px solid var(--accent);display:flex;align-items:center;gap:10px}
header .ev{flex:1;min-width:0}
header .ev b{display:block;font-size:16px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .ev small{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.8px}
.lap{text-align:right;font-weight:900;font-size:22px;line-height:1}
.lap small{display:block;font-size:10px;color:var(--dim);letter-spacing:1px;font-weight:700}
.pill{font-size:11px;font-weight:900;padding:3px 8px;border-radius:5px;text-transform:uppercase;white-space:nowrap}
#conn{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim);padding:5px 12px;background:#0f1218;border-bottom:1px solid var(--line2)}
#conn i{width:8px;height:8px;border-radius:50%;background:#555;display:inline-block}
#conn.on i{background:var(--green);box-shadow:0 0 8px var(--green)}
#conn .grow{flex:1}
main{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.pane{display:none}
.pane.on{display:block}
nav{display:flex;border-top:1px solid var(--line);background:#08090d;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:none;color:var(--dim);font:inherit;font-size:12px;font-weight:700;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:19px;line-height:1}
nav button.on{color:var(--text);box-shadow:inset 0 3px 0 var(--accent)}
.row{display:grid;grid-template-columns:26px 4px 46px 1fr 74px 40px;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--line2)}
.row.sel{background:#1a2030}
.row .p{font-weight:900;text-align:right}
.row .bar{height:22px;border-radius:2px}
.row .t{font-weight:900}
.row .t small{display:block;color:var(--dim);font-weight:600;font-size:11px}
.row .g{text-align:right;font-size:14px}
.row .g small{display:block;color:var(--dim);font-size:11px}
.row .l{text-align:right;font-size:13px}
.row .l.pb{color:var(--green)}.row .l.ob{color:var(--purple)}
.tyre{display:flex;align-items:center;justify-content:flex-end;gap:3px;font-size:12px}
.ti{width:20px;height:20px;border-radius:50%;border:3px solid;display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:9px;background:#0c0e12}
.tag{font-size:9px;font-weight:900;padding:1px 4px;border-radius:3px;margin-left:4px;vertical-align:2px}
.tag.pit{background:var(--blue);color:#fff}.tag.out{background:#555;color:#fff}
.mini{display:flex;gap:1px;margin-top:3px}
.mini i{height:3px;flex:1;border-radius:1px;background:#2b313c}
.head{display:grid;grid-template-columns:26px 4px 46px 1fr 74px 40px;gap:8px;padding:6px 12px;font-size:10px;letter-spacing:1px;color:var(--dim);text-transform:uppercase;font-weight:700;border-bottom:1px solid var(--line)}
.head span:nth-child(4),.head span:nth-child(5),.head span:nth-child(6){text-align:right}
.seg{display:flex;gap:4px;padding:8px 12px}
.seg button{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--dim);border-radius:7px;padding:6px;font:inherit;font-size:12px;font-weight:700}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
#mapBox{position:relative;height:min(92vw,52vh);min-height:260px}
.crow{display:grid;grid-template-columns:24px 4px 44px 1fr 44px;gap:8px;align-items:center;padding:5px 12px;border-bottom:1px solid var(--line2);font-size:14px}
.crow.sel{background:#1a2030}
.crow .p{font-weight:900;text-align:right}.crow .bar{height:16px;border-radius:2px}.crow .t{font-weight:900}.crow .g{text-align:right}
nav em{font-style:normal}
#map{width:100%;height:100%;display:block}
.note{color:var(--dim);font-size:12px;padding:8px 12px}
.msg{padding:9px 12px;border-bottom:1px solid var(--line2);display:flex;gap:8px;font-size:13px}
.msg .f{width:6px;border-radius:2px;flex:none}
.msg .w{color:var(--dim);font-size:11px;min-width:44px}
.idle{padding:28px 18px;text-align:center}
.idle h2{margin:0 0 6px;font-size:22px}
.idle .cd{font-size:30px;font-weight:900;margin:12px 0}
.btn{display:inline-block;padding:10px 16px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);color:var(--text);text-decoration:none;font-weight:700;margin:4px}
.btn.main{background:var(--accent);border-color:var(--accent)}
.set{padding:14px 12px;border-bottom:1px solid var(--line2)}
.set h4{margin:0 0 8px;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--dim)}
.delay{display:flex;align-items:center;gap:8px}
.delay button{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 12px;font:inherit;font-weight:700}
.delay b{font-size:22px;min-width:64px;text-align:center}
footer{font-size:11px;color:var(--dim2);padding:16px 12px 24px;line-height:1.4}
</style>
</head>
<body>
<header>
  <img src="icon-192.png" alt="" style="width:30px;height:30px;border-radius:7px">
  <div class="ev"><b id="ev">Free to Race</b><small id="ses">Live</small></div>
  <span class="pill" id="track" style="display:none"></span>
  <div class="lap tn" id="lap"></div>
</header>
<div id="conn"><i></i><span id="connTxt"></span><span class="grow"></span><span id="delayTxt" class="tn"></span></div>
<main>
  <div class="pane on" id="p-times">
    <div class="seg" id="gapMode"><button data-g="gap" class="on" data-t="gapLeader"></button><button data-g="int" data-t="gapAhead"></button></div>
    <div class="head"><span>P</span><span></span><span data-t="driver"></span><span id="hGap" data-t="gap"></span><span data-t="last"></span><span data-t="tyre"></span></div>
    <div id="rows"></div>
    <div id="idle"></div>
  </div>
  <div class="pane" id="p-map"><div id="mapBox"><canvas id="map"></canvas></div><div class="note" id="mapNote"></div><div id="mapRows"></div></div>
  <div class="pane" id="p-rc"><div id="rc"></div></div>
  <div class="pane" id="p-set">
    <div class="set"><h4 data-t="delayH"></h4><div class="delay"><button data-d="-5">−5</button><b id="delayV" class="tn">0 s</b><button data-d="5">+5</button><button data-d="30">+30</button><button data-d="0" data-r="1">0</button></div>
      <p class="dim" style="font-size:13px" data-t="delayP"></p></div>
    <div class="set"><h4 data-t="langH"></h4><div class="seg" style="padding:0"><button data-l="en">English</button><button data-l="it">Italiano</button></div></div>
    <div class="set"><h4 data-t="homeH"></h4><p class="dim" style="font-size:13px;margin:0" data-t="homeP"></p></div>
    <div class="set"><a class="btn main" href="../" data-t="pc"></a> <a class="btn" href="https://ko-fi.com/freetorace" data-t="coffee"></a></div>
    <footer data-t="disc"></footer>
  </div>
</main>
<nav>
  <button data-tab="times" class="on"><span>⏱</span><em data-t="tTimes"></em></button>
  <button data-tab="map"><span>◎</span><em data-t="tMap"></em></button>
  <button data-tab="rc"><span>⚑</span><em data-t="tRc"></em></button>
  <button data-tab="set"><span>⚙</span><em data-t="tSet"></em></button>
</nav>
<script>
// Free to Race Live: il telefono si collega da solo al feed in diretta della F1 (stesso flusso del programma
// per PC, senza server in mezzo). Tempi, gomme, mappa con le auto stimate dai minisettori, direzione gara.
const T = {
 en:{gapLeader:'Gap to leader', gapAhead:'Interval', driver:'Driver', gap:'Gap', gapBest:'To best', last:'Last', tyre:'Tyre',
  tTimes:'Times', tMap:'Track', tRc:'Race control', tSet:'Settings', delayH:'Delay', delayP:'Shows everything a few seconds later, to stay in sync with your TV and avoid spoilers.',
  langH:'Language', homeH:'On your home screen', homeP:'Browser menu → “Add to Home screen”: it opens like an app.', pc:'Free to Race for PC', coffee:'☕ Buy me a coffee',
  disc:'Unofficial fan project, not associated in any way with the Formula 1 companies. F1, FORMULA ONE, FORMULA 1, GRAND PRIX and related marks are trade marks of Formula One Licensing B.V. Live data straight from the public F1 live timing to your phone. Circuit drawings: MultiViewer.',
  live:'Live', idleConn:'Connected to F1 timing', connecting:'Connecting…', reconnecting:'Reconnecting…', noSession:'No session live right now', last_:'Last session', next:'Next session', demo:'▶ Try the replay demo', lap:'LAP', left:'LEFT',
  retired:'OUT', pit:'PIT', mapApprox:'Approximate map: it gets precise after the first session on this circuit.', mapNone:'Track layout not available.', mapOk:'Cars estimated from the official timing, about 10 m accuracy.', noMsg:'No messages yet.', locale:'en-GB',
  track:{'1':'Track clear','2':'Yellow','4':'Safety Car','5':'Red flag','6':'VSC','7':'VSC ending'}},
 it:{gapLeader:'Dal primo', gapAhead:'Da chi precede', driver:'Pilota', gap:'Distacco', gapBest:'Dal migliore', last:'Ultimo', tyre:'Gomma',
  tTimes:'Tempi', tMap:'Pista', tRc:'Direzione gara', tSet:'Impostazioni', delayH:'Ritardo', delayP:'Mostra tutto qualche secondo dopo, per restare allineato alla TV e non avere spoiler.',
  langH:'Lingua', homeH:'Sulla schermata Home', homeP:'Menu del browser → «Aggiungi a schermata Home»: si apre come un’app.', pc:'Free to Race per PC', coffee:'☕ Offrimi un caffè',
  disc:'Progetto di appassionati non ufficiale, non associato in alcun modo alle società di Formula 1. F1, FORMULA ONE, FORMULA 1, GRAND PRIX e i marchi collegati appartengono a Formula One Licensing B.V. I dati arrivano al telefono direttamente dal cronometraggio pubblico F1. Disegni dei circuiti: MultiViewer.',
  live:'In diretta', idleConn:'Collegato al cronometraggio F1', connecting:'Mi collego…', reconnecting:'Mi ricollego…', noSession:'Nessuna sessione in diretta adesso', last_:'Ultima sessione', next:'Prossima sessione', demo:'▶ Prova la demo in replay', lap:'GIRO', left:'MANCANO',
  retired:'RIT', pit:'BOX', mapApprox:'Mappa approssimata: diventa precisa dopo la prima sessione su questo circuito.', mapNone:'Disegno della pista non disponibile.', mapOk:'Auto stimate dal cronometraggio ufficiale, precisione circa 10 m.', noMsg:'Ancora nessun messaggio.', locale:'it-IT',
  track:{'1':'Pista libera','2':'Gialla','4':'Safety Car','5':'Bandiera rossa','6':'VSC','7':'Fine VSC'}}};
const store = {get(k,d){try{return localStorage.getItem(k)??d}catch(e){return d}}, set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
let LANG = (()=>{ const s=store.get('ftr.lang',''); if(s==='it'||s==='en') return s; return /^it\b/i.test(navigator.language||'')?'it':'en'; })();
const t = k => T[LANG][k];
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const col = c => /^[0-9a-f]{6}$/i.test(String(c||'').replace('#','')) ? '#'+String(c).replace('#','') : '#888';
const TYRE = {SOFT:['#ff3b3b','S'],MEDIUM:['#ffd12e','M'],HARD:['#f2f2f2','H'],INTERMEDIATE:['#43b047','I'],WET:['#2f7fd1','W']};
const TRACKC = {'1':['#1f9d55','#fff'],'2':['#ffd12e','#111'],'4':['#ff9f1a','#111'],'5':['#e10600','#fff'],'6':['#ff9f1a','#111'],'7':['#ffd12e','#111']};
const OK = new Set([2048,2049,2051,2064]);
const LIVE_LAG = 2.1;        // i passaggi arrivano circa 2,1 s dopo il passaggio vero (misurato sull'archivio)
const secs = v => { if(!v || typeof v!=='string') return null; v=v.trim().replace('+',''); const p=v.split(':'); const x = p.length>1 ? (+p[0])*60+parseFloat(p[1]) : parseFloat(p[0]); return isNaN(x)?null:x; };

// ---------------- stato: stessa unione dei messaggi del programma per PC ----------------
function merge(base, upd){
  if(upd && typeof upd==='object' && !Array.isArray(upd)){
    if(Array.isArray(base)){ for(const [k,v] of Object.entries(upd)){ if(!/^\d+$/.test(k)) continue; const i=+k; while(base.length<=i) base.push(null); base[i]=merge(base[i],v); } return base; }
    if(!base || typeof base!=='object') base={};
    for(const [k,v] of Object.entries(upd)){ if(k==='_deleted'){ for(const d of v) delete base[String(d)]; continue; } base[k]=merge(base[k],v); }
    return base;
  }
  return upd;
}
const asList = x => Array.isArray(x) ? x.filter(v=>v!=null) : (x && typeof x==='object') ? Object.keys(x).sort((a,b)=>a-b).map(k=>x[k]) : [];
const ST = {};
const trk = {last:{}, ratio:{}, pitIn:{}};      // ultimo minisettore passato per auto, andatura, ingresso ai box
let selNum = null, gapMode = 'gap', tab = 'times';

function apply(topic, data, when){
  if(topic.endsWith('.z')) return;
  if(topic==='TimingData') passages(data, when);
  ST[topic] = merge(ST[topic], data);
}
function passages(upd, when){
  const lines = (upd && upd.Lines) || {};
  for(const [n,u] of Object.entries(lines)){
    if(!u || typeof u!=='object') continue;
    if('InPit' in u){ if(u.InPit) trk.pitIn[n] = trk.pitIn[n] || when; else delete trk.pitIn[n]; }
    const secsU = u.Sectors; if(!secsU) continue;
    const full = ((ST.TimingData||{}).Lines||{})[n] || {};
    const liveN = asList(full.Sectors).map(s=>asList((s||{}).Segments).length);
    for(const [si,sc] of Object.entries(secsU)){
      const segs = sc && sc.Segments; if(!segs) continue;
      for(const [k,v] of Object.entries(segs)){
        if(v && OK.has(v.Status)){ const idx = mapIdx(+si, +k, liveN); if(idx!=null) passage(n, idx, when - LIVE_LAG); }
      }
    }
  }
}
function passage(n, idx, tt){
  const prev = trk.last[n]; if(prev && prev[0]===idx) return;
  if(prev && cal && idx===(prev[0]+1)%cal.refDur.length){ const r=(tt-prev[1])/Math.max(0.5,cal.refDur[idx]); if(r>0.5&&r<6){ const l=trk.ratio[n]=trk.ratio[n]||[]; l.push(r); if(l.length>3) l.shift(); } }
  trk.last[n] = [idx, tt];
}
const pace = n => { const l=(trk.ratio[n]||[]).slice().sort((a,b)=>a-b); return l.length ? Math.min(3,Math.max(0.7,l[Math.floor(l.length/2)])) : 1; };

// ---------------- collegamento al feed F1 ----------------
const WS = new URLSearchParams(location.search).get('ws') || 'wss://livetiming.formula1.com/signalrcore';
const TOPICS = ['Heartbeat','ExtrapolatedClock','TimingStats','TimingAppData','WeatherData','TrackStatus','DriverList','RaceControlMessages','SessionInfo','SessionData','LapCount','TimingData'];
const RS = '\x1e';
let ws=null, queue=[], delay=+store.get('ftr.delay','0')||0, connected=false, retry=0, lastMsg=0;
function connect(){
  setConn(retry ? t('reconnecting') : t('connecting'), false);
  try{ ws = new WebSocket(WS); }catch(e){ return later(); }
  ws.onopen = () => { ws.send(JSON.stringify({protocol:'json', version:1})+RS);
    ws.send(JSON.stringify({type:1, target:'Subscribe', arguments:[TOPICS], invocationId:'0'})+RS); };
  ws.onmessage = ev => {
    lastMsg = Date.now();
    for(const part of String(ev.data).split(RS)){
      if(!part) continue; let o; try{ o=JSON.parse(part); }catch(e){ continue; }
      const now = performance.now()/1000;
      if(o.type===3 && o.result){ connected=true; retry=0; setConn(t('live'), true);
        const order={SessionInfo:0, DriverList:1}; for(const k of Object.keys(o.result).sort((a,b)=>(order[a]??2)-(order[b]??2))) queue.push([now, k, o.result[k]]); }
      else if(o.type===1 && o.target==='feed' && o.arguments) queue.push([now, o.arguments[0], o.arguments[1]]);
      else if(o.type===7){ ws.close(); }
    }
  };
  ws.onclose = () => { connected=false; later(); };
  ws.onerror = () => {};
}
function later(){ retry++; setConn(t('reconnecting'), false); setTimeout(connect, Math.min(30000, 2000*retry)); }
setInterval(()=>{ if(ws && ws.readyState===1) ws.send(JSON.stringify({type:6})+RS); if(connected && Date.now()-lastMsg>60000) ws.close(); }, 15000);
function pump(){
  const now = performance.now()/1000;
  let changed = false;
  while(queue.length && now - queue[0][0] >= delay){ const [w, k, d] = queue.shift(); apply(k, d, w + delay); changed = true; }
  if(changed) render();
}
setInterval(pump, 250);
function setConn(txt, on){ $('#conn').classList.toggle('on', on); $('#connTxt').textContent = txt; }

// ---------------- tempi ----------------
function drivers(){
  const dl = ST.DriverList || {}, td = ((ST.TimingData||{}).Lines)||{}, ta = ((ST.TimingAppData||{}).Lines)||{};
  const out = [];
  for(const [n,d] of Object.entries(dl)){
    if(!d || !d.Tla) continue;
    const l = td[n] || {}, st = asList((ta[n]||{}).Stints), cur = st[st.length-1] || null;
    const pos = parseInt(l.Position || d.Line);
    out.push({n, tla:d.Tla, team:d.TeamName, color:col(d.TeamColour), pos:isNaN(pos)?99:pos, gap:l.GapToLeader||'', int:(l.IntervalToPositionAhead||{}).Value||'',
      last:(l.LastLapTime||{}).Value||'', lastPb:!!(l.LastLapTime||{}).PersonalFastest, lastOb:!!(l.LastLapTime||{}).OverallFastest, best:(l.BestLapTime||{}).Value||'',
      inPit:!!l.InPit, out:!!(l.Retired||l.Stopped||l.KnockedOut), pits:l.NumberOfPitStops||0,
      tyre:cur?String(cur.Compound||'').toUpperCase():null, age:cur?(cur.TotalLaps||0):null, segs:asList(l.Sectors).map(s=>asList((s||{}).Segments).map(x=>(x||{}).Status||0))});
  }
  return out.sort((a,b)=>a.pos-b.pos);
}
const segColor = s => s===2051?'var(--purple)':s===2049?'var(--green)':s===2064?'var(--blue)':s?'var(--yellow)':'#2b313c';
function render(){
  const si = ST.SessionInfo || {}, m = si.Meeting || {}, race = si.Type==='Race';
  $('#ev').textContent = m.Name || 'Free to Race';
  $('#ses').textContent = [si.Name, m.Location].filter(Boolean).join(' · ') || 'Live';
  const ts = String((ST.TrackStatus||{}).Status||''), tc = TRACKC[ts], tp=$('#track');
  if(tc && ts!=='1'){ tp.style.display=''; tp.textContent=t('track')[ts]; tp.style.background=tc[0]; tp.style.color=tc[1]; } else tp.style.display='none';
  const lc = ST.LapCount || {};
  if(race && lc.CurrentLap) $('#lap').innerHTML = `${lc.CurrentLap}<span class="dim" style="font-size:13px">/${lc.TotalLaps||'?'}</span><small>${t('lap')}</small>`;
  else { const r = remaining(); $('#lap').innerHTML = r!=null ? `${fmtT(r)}<small>${t('left')}</small>` : ''; }
  const live = isLive();
  if(connected) setConn(live ? t('live') : t('idleConn'), true);
  const ds = drivers();
  $('#gapMode').style.display = race && live ? '' : 'none';
  $('#hGap').textContent = race ? t('gap') : t('gapBest');
  let ref = null; if(!race){ for(const d of ds){ const b=secs(d.best); if(b!=null && (ref==null || b<ref)) ref=b; } }
  $('#rows').innerHTML = ds.map(d => {
    let g;
    if(race) g = d.pos===1 ? '<span class="dim">Leader</span>' : esc(gapMode==='int' ? d.int : d.gap);
    else { const b=secs(d.best); g = b==null ? '' : b===ref ? `<b>${esc(d.best)}</b>` : `+${(b-ref).toFixed(3)}<small>${esc(d.best)}</small>`; }
    const ty = d.tyre && TYRE[d.tyre] ? `<i class="ti" style="border-color:${TYRE[d.tyre][0]};color:${TYRE[d.tyre][0]}">${TYRE[d.tyre][1]}</i>${d.age??''}` : '';
    const tag = d.out ? `<span class="tag out">${t('retired')}</span>` : d.inPit ? `<span class="tag pit">${t('pit')}</span>` : '';
    const mini = d.segs.flat().map(s=>`<i style="background:${segColor(s)}"></i>`).join('');
    return `<div class="row ${selNum===d.n?'sel':''}" data-n="${esc(d.n)}"><span class="p tn">${d.pos<99?d.pos:''}</span><span class="bar" style="background:${d.color}"></span>
      <span class="t">${esc(d.tla)}${tag}<small>${esc((d.team||'').replace(/ F1 Team$/,''))}</small></span>

  $('#mapRows').innerHTML = live ? ds.map(d => { let g; if(race) g = d.pos===1 ? 'Leader' : esc(gapMode==='int' ? d.int : d.gap); else { const b=secs(d.best); g = b==null ? '' : b===ref ? esc(d.best) : '+'+(b-ref).toFixed(3); }
    const ty = d.tyre && TYRE[d.tyre] ? `<i class="ti" style="border-color:${TYRE[d.tyre][0]};color:${TYRE[d.tyre][0]}">${TYRE[d.tyre][1]}</i>` : '';
    return `<div class="crow ${selNum===d.n?'sel':''}" data-n="${esc(d.n)}"><span class="p tn">${d.pos<99?d.pos:''}</span><span class="bar" style="background:${d.color}"></span><span class="t">${esc(d.tla)}${d.inPit?`<span class="tag pit">${t('pit')}</span>`:''}</span><span class="g tn">${g}</span><span class="tyre">${ty}</span></div>`; }).join('') : '';
  renderRc();

}
function remaining(){
  const ec = ST.ExtrapolatedClock || {}; const p = String(ec.Remaining||'').split(':'); if(p.length<3) return null;

}
const fmtT = s => { s=Math.max(0,Math.round(s)); const h=Math.floor(s/3600), m=Math.floor(s%3600/60), x=s%60; return (h?h+':'+String(m).padStart(2,'0'):m)+':'+String(x).padStart(2,'0'); };
function isLive(){

['#rows','#mapRows'].forEach(sel_ => $(sel_).addEventListener('click', e => { const r=e.target.closest('[data-n]'); if(!r) return; selNum = selNum===r.dataset.n ? null : r.dataset.n; render(); }));
$$('#gapMode [data-g]').forEach(b => b.onclick = () => { gapMode=b.dataset.g; $$('#gapMode [data-g]').forEach(x=>x.classList.toggle('on',x===b)); render(); });

// nessuna sessione in diretta: l'ultima e la prossima (calendario Jolpica)
let nextSess = null;
async function loadNext(){
  try{ const r = await (await fetch('https://api.jolpi.ca/ergast/f1/current/races/?limit=40')).json(); const now=Date.now(), out=[];
    for(const race of r.MRData.RaceTable.Races){
      for(const [k,lbl] of [['FirstPractice','Practice 1'],['SecondPractice','Practice 2'],['ThirdPractice','Practice 3'],['SprintQualifying','Sprint Qualifying'],['Sprint','Sprint'],['Qualifying','Qualifying'],['',race.raceName?'Race':'']]){
        const x = k ? race[k] : {date:race.date, time:race.time}; if(!x || !x.date) continue;
        const d = Date.parse(x.date+'T'+(x.time||'12:00:00Z')); if(d > now - 2*3600e3) out.push({d, name:race.raceName, s:lbl}); } }
    out.sort((a,b)=>a.d-b.d); nextSess = out[0] || null; render();
  }catch(e){}
}
function idleHtml(){
  const si = ST.SessionInfo || {}, m = si.Meeting || {};
  let h = `<div class="idle"><h2>${t('noSession')}</h2>`;
  if(m.Name) h += `<div class="dim">${t('last_')}: ${esc(m.Name)} · ${esc(si.Name||'')}</div>`;
  if(nextSess){ const left = Math.max(0, (nextSess.d - Date.now())/1000), dd=Math.floor(left/86400);
    h += `<div style="margin-top:18px" class="dim">${t('next')}</div><div style="font-weight:900;font-size:18px">${esc(nextSess.name)} · ${esc(nextSess.s)}</div>
      <div class="dim">${new Date(nextSess.d).toLocaleString(t('locale'),{weekday:'long', day:'numeric', month:'long', hour:'2-digit', minute:'2-digit'})}</div>
      <div class="cd tn">${dd?dd+'d ':''}${fmtT(left%86400)}</div>`; }
  return h + `<a class="btn" href="../demo/">${t('demo')}</a></div>`;
}
setInterval(()=>{ if(!isLive() && nextSess && tab==='times') $('#idle').innerHTML = idleHtml(); }, 1000);

// ---------------- direzione gara ----------------
const FLAG = {GREEN:'#22d36b',YELLOW:'#ffd12e','DOUBLE YELLOW':'#ffd12e',RED:'#e10600',BLUE:'#3d8bff',CLEAR:'#22d36b',CHEQUERED:'#fff'};
function renderRc(){
  const ms = asList((ST.RaceControlMessages||{}).Messages).slice(-60).reverse();
  $('#rc').innerHTML = ms.map(m => `<div class="msg"><span class="f" style="background:${FLAG[m.Flag]||(m.Category==='SafetyCar'?'#ff9f1a':'#3a4150')}"></span><span class="w tn">${m.Lap?(LANG==='it'?'G':'L')+m.Lap:''}<br>${m.Utc?new Date(m.Utc+(String(m.Utc).endsWith('Z')?'':'Z')).toLocaleTimeString(t('locale'),{hour:'2-digit',minute:'2-digit'}):''}</span><span>${esc(m.Message)}</span></div>`).join('') || `<div class="note">${t('noMsg')}</div>`;
}

// ---------------- pista: auto stimate dai minisettori, come nel programma per PC ----------------
let circuit=null, circuitKey='', cal=null, geo=null;
async function loadCircuit(key, year){
  const k = key+'/'+year; if(circuitKey===k) return; circuitKey=k; circuit=null; cal=null; geo=null;
  try{ circuit = await (await fetch(`https://api.multiviewer.app/api/v1/circuits/${key}/${year}`)).json(); }catch(e){ circuit=null; }
  try{ const r = await fetch(`../circuiti/${key}_${year}.json`); if(r.ok) cal = await r.json(); }catch(e){}
  if(cal && cal.track) circuit = cal.track;
  if(!cal) cal = approximate();
}
function approximate(){       // senza taratura: minisettori uguali, velocita' costante
  const live = asList((Object.values(((ST.TimingData||{}).Lines)||{})[0]||{}).Sectors).map(s=>asList((s||{}).Segments).length);
  const ns = live.length===3 && live.every(x=>x) ? live : [8,8,8], N = ns.reduce((a,b)=>a+b,0), lin=[...Array(11)].map((_,j)=>j/10);
  return {bounds:[...Array(N)].map((_,i)=>((i+1)/N)%1), refDur:Array(N).fill(95/N), profile:Array(N).fill(lin), nseg:ns, approx:true, pitLane:{x:[],y:[]}, pitTime:25};
}
function mapIdx(si, k, liveN){
  const cn = (cal && cal.nseg) || liveN; if(!cn || si>=cn.length) return null;
  if(liveN && liveN[si] && liveN[si]!==cn[si]) k = Math.max(0, Math.min(cn[si]-1, Math.round((k+1)*cn[si]/liveN[si])-1));
  else if(k>=cn[si]) return null;
  let s=0; for(let i=0;i<si;i++) s+=cn[i]; return s+k;
}
function estFrac(idx, age, pc){
  const N=cal.refDur.length; let i=idx, tt=Math.max(0,age);
  for(let k=0;k<2;k++){ const d=Math.max(0.3, cal.refDur[(i+1)%N]*pc); if(tt<=d) break; tt-=d; i=(i+1)%N; }
  const nx=(i+1)%N, a=cal.bounds[i], z=cal.bounds[nx], tau=Math.min(1, tt/Math.max(0.3, cal.refDur[nx]*pc));
  const pr=cal.profile[nx], x=tau*(pr.length-1), j=Math.min(pr.length-2, Math.floor(x)), sv=pr[j]+(pr[j+1]-pr[j])*(x-j);
  return (a + (((z-a)%1)+1)%1*sv) % 1;
}
function mkGeo(W,H){
  if(geo && geo.W===W && geo.H===H) return geo;
  const mv=circuit, rot=(mv.rotation||0)*Math.PI/180, c=Math.cos(rot), s=Math.sin(rot), tr=(x,y)=>[x*c-y*s, x*s+y*c];
  const pts=mv.x.map((x,i)=>tr(x,mv.y[i])), xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]), pad=26;
  const mx=Math.min(...xs), Mx=Math.max(...xs), my=Math.min(...ys), My=Math.max(...ys), k=Math.min((W-2*pad)/((Mx-mx)||1),(H-2*pad)/((My-my)||1));
  const P=(x,y)=>{ const [a,b]=tr(x,y); return [pad+(a-mx)*k+((W-2*pad)-(Mx-mx)*k)/2, H-pad-(b-my)*k-((H-2*pad)-(My-my)*k)/2]; };
  const scr=mv.x.map((x,i)=>P(x,mv.y[i])), cum=[0];
  for(let i=1;i<=mv.x.length;i++){ const j=i%mv.x.length; cum.push(cum[i-1]+Math.hypot(mv.x[j]-mv.x[i-1],mv.y[j]-mv.y[i-1])); }
  const at = f => { const tot=cum[cum.length-1], d=((f%1)+1)%1*tot; let lo=0, hi=cum.length-1; while(hi-lo>1){ const m=(lo+hi)>>1; if(cum[m]<=d) lo=m; else hi=m; }
    const r=(d-cum[lo])/((cum[hi]-cum[lo])||1), p=scr[lo], q=scr[hi%scr.length]; return [p[0]+(q[0]-p[0])*r, p[1]+(q[1]-p[1])*r]; };
  const lane = cal && cal.pitLane && cal.pitLane.x.length>1 ? cal.pitLane.x.map((x,i)=>P(x,cal.pitLane.y[i])) : null;
  return geo = {W,H,scr,at,lane};
}
const disp = {};
let lastFrame = performance.now();
function drawMap(){
  requestAnimationFrame(drawMap);
  if(tab!=='map') return;
  const cv=$('#map'), r=cv.parentElement.getBoundingClientRect(), dpr=window.devicePixelRatio||1;
  if(cv.width!==Math.round(r.width*dpr) || cv.height!==Math.round(r.height*dpr)){ cv.width=Math.round(r.width*dpr); cv.height=Math.round(r.height*dpr); geo=null; }
  const g=cv.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,r.width,r.height);
  if(!circuit || !circuit.x){ $('#mapNote').textContent = circuitKey ? t('mapNone') : ''; return; }
  const G = mkGeo(r.width, r.height);
  g.lineCap='round'; g.lineJoin='round';
  g.strokeStyle='#05070a'; g.lineWidth=14; g.beginPath(); G.scr.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])); g.closePath(); g.stroke();
  g.strokeStyle='#3a4150'; g.lineWidth=8; g.stroke();
  const fin = cal ? cal.bounds[cal.refDur.length-1] : 0, a=G.at(fin-0.003), b=G.at(fin+0.003), p=G.at(fin), dx=b[0]-a[0], dy=b[1]-a[1], l=Math.hypot(dx,dy)||1;
  g.strokeStyle='#fff'; g.lineWidth=3; g.beginPath(); g.moveTo(p[0]+dy/l*10,p[1]-dx/l*10); g.lineTo(p[0]-dy/l*10,p[1]+dx/l*10); g.stroke();
  $('#mapNote').textContent = cal && cal.approx ? t('mapApprox') : t('mapOk');
  if(!cal || !isLive()) return;
  const now = performance.now()/1000, dt = Math.min(0.1, now - lastFrame/1000); lastFrame = performance.now();
  const ds = drivers().slice().reverse(), lines = ((ST.TimingData||{}).Lines)||{};
  for(const d of ds){
    if(d.out) continue;
    const L = trk.last[d.n]; let xy;
    if(lines[d.n] && lines[d.n].InPit && G.lane){ const f=Math.min(0.98, (now - (trk.pitIn[d.n]||now))/(cal.pitTime||25)); const i=Math.min(G.lane.length-2, Math.floor(f*(G.lane.length-1))); xy=G.lane[i]; delete disp[d.n]; }
    else if(L){
      const ft = estFrac(L[0], now - L[1], pace(d.n));
      let q = disp[d.n]; const delta = q ? ((ft-q.f+0.5)%1+1)%1-0.5 : 1;
      if(!q || Math.abs(delta)>0.03) q = disp[d.n] = {f:ft};
      else { const vt = (((estFrac(L[0], now-L[1]+0.2, pace(d.n))-ft)%1+1)%1)/0.2; q.f = (q.f + Math.max(0.25*vt, vt + delta/1.2)*dt) % 1; }
      xy = G.at(q.f);
    }
    if(!xy) continue;
    const on = selNum===d.n, faded = selNum && !on;
    g.globalAlpha = faded ? .3 : 1;
    g.fillStyle=d.color; g.beginPath(); g.arc(xy[0],xy[1],on?8:6,0,7); g.fill(); g.strokeStyle='#05070a'; g.lineWidth=1.5; g.stroke();
    if(!faded){ g.font=`bold ${on?13:10}px Titillium Web`; g.fillStyle='rgba(11,13,18,.75)'; const w=g.measureText(d.tla).width; g.fillRect(xy[0]+8,xy[1]-17,w+6,14); g.fillStyle='#fff'; g.fillText(d.tla, xy[0]+11, xy[1]-6); }
  }
  g.globalAlpha=1;
}
requestAnimationFrame(drawMap);
