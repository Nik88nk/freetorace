function longRuns(n){

  let run = null, prev = null;

// scritto nella serie (Utc), e quelli di prima dell'inizio della registrazione (stati vecchi) non contano
function demoMarks(ev, t0, end){
  const starts=[], phases=[], seen=new Set(), after=[]; let cur=null, red=null;
  for(const [w,k,d] of ev){
    if(k==='SessionData'){ for(const e of asList((d||{}).StatusSeries)){ const st=e&&e.SessionStatus;
        if(!st) continue;
        const key=(e.Utc||'')+'|'+st; if(seen.has(key)) continue; seen.add(key);
        let u = e.Utc ? Date.parse(/(Z|[+-]\d\d:?\d\d)$/.test(e.Utc) ? e.Utc : e.Utc+'Z') : w; if(isNaN(u)) u = w;
        if(u < t0) continue;
        after.push([u, st]);
        if(st==='Started'){ starts.push(u); if(red){ red.to=u; phases.push(red); red=null; } }
        else if((st==='Aborted'||st==='Suspended') && !red) red={kind:'red', from:u};
        else if(/^(Finished|Finalised|Ends)$/.test(st) && red){ red.to=u; phases.push(red); red=null; } } }
    else if(k==='TrackStatus'){ const c=String((d||{}).Status||''); if(c==='5' && !red) red={kind:'red', from:w};
      const kind={'4':'sc','6':'vsc','7':'vsc'}[c]; if(cur && cur.kind!==kind){ cur.to=w; phases.push(cur); cur=null; } if(kind && !cur) cur={kind, from:w}; }
  }
  for(const o of [cur, red]) if(o){ o.to=end; phases.push(o); }
  phases.sort((a,b)=>a.from-b.from);
  after.sort((a,b)=>a[0]-b[0]);
  const late = after.length>0 && /^(Aborted|Suspended|Finished|Finalised|Ends)$/.test(after[0][1]);

function playIntro(force){
  return new Promise(async done => {
    if(!force && (store.get('ftr.intro','') === '1' || matchMedia('(prefers-reduced-motion: reduce)').matches)) return done();

    const ov = document.createElement('div'); ov.id = 'intro';
    ov.innerHTML = `<canvas></canvas><button class="skip">${L('Salta','Skip')} ✕</button>`;
    document.body.appendChild(ov);
    let raf = 0, closed = false;
    const close = () => { if(closed) return; closed = true; cancelAnimationFrame(raf); ov.classList.add('out');
      setTimeout(()=>{ ov.remove(); document.removeEventListener('keydown', key); done(); }, 650); };
    const key = e => { if(e.key==='Escape') close(); };
    document.addEventListener('keydown', key);
    ov.querySelector('.skip').onclick = close;
    run();

    function run(){
      // ---------- tempi (secondi) ----------
      const LIGHT = [0.4, 1.0, 1.6, 2.2, 2.8], OUT = 3.6 + Math.random()*0.5, LOGO = OUT + 3.1, END = LOGO + 2.4;

      // ---------- pista e auto ----------
      const P = []; for(let i=0;i<INTRO_TRACK.length;i+=2) P.push([INTRO_TRACK[i], INTRO_TRACK[i+1]]);
      const N = P.length;
      // velocita' lungo il giro: piu' lenta dove la pista curva di piu' (curvatura sui punti vicini, smussata)
      const curv = P.map((p,i) => { const a=P[(i-3+N)%N], b=P[(i+3)%N]; const a1=Math.atan2(p[1]-a[1],p[0]-a[0]), a2=Math.atan2(b[1]-p[1],b[0]-p[0]); let d=Math.abs(a2-a1); if(d>Math.PI) d=2*Math.PI-d; return d; });
      const spd = curv.map((_,i) => { let s=0; for(let k=-4;k<=4;k++) s+=curv[(i+k+N)%N]; return 1/(1+s*1.6); });
      const at = f => { const x=((f%1)+1)%1*N, i=Math.floor(x), r=x-i, a=P[i], b=P[(i+1)%N]; return [a[0]+(b[0]-a[0])*r, a[1]+(b[1]-a[1])*r]; };
      const vAt = f => spd[Math.floor(((f%1)+1)%1*N)];
      const cars = Array.from({length:22}, (_,i) => ({f: -0.009*i - 0.003*(i%2), col: INTRO_TEAMS[Math.floor(i/2)%INTRO_TEAMS.length], k: 1 + (Math.random()-0.5)*0.14 - i*0.004, tr: []}));

      const cv = ov.querySelector('canvas'), g = cv.getContext('2d');
      const t0 = performance.now(); let last = t0, shake = 0;
      const frame = now => {
        const dpr = window.devicePixelRatio||1, W = innerWidth, H = innerHeight;
        if(cv.width!==Math.round(W*dpr)){ cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); }
        g.setTransform(dpr,0,0,dpr,0,0);
        const t = (now - t0)/1000, dt = Math.min(0.05, (now-last)/1000); last = now;
        g.fillStyle = '#05060a'; g.fillRect(0,0,W,H);
        // vignetta rossa che pulsa con le luci
        const tall = W < H, R = tall ? Math.min(H*0.34, W*0.86) : Math.min(W,H)*0.42;
        // ----- semafori -----
        if(t < OUT + 0.25){
          const lw = Math.min(110, W/8), gap = lw*0.28, x0 = W/2 - (5*lw+4*gap)/2, y = H/2 - lw/2;
          for(let i=0;i<5;i++){
            const on = t >= LIGHT[i] && t < OUT, x = x0 + i*(lw+gap);
            g.fillStyle = '#111318'; g.beginPath(); g.roundRect(x-8, y-lw*0.9, lw+16, lw*2.8, 14); g.fill();
            for(let row=0; row<2; row++){ const cy = y + row*lw*1.05;
              g.beginPath(); g.arc(x+lw/2, cy+lw/2-lw*0.35, lw*0.4, 0, 7);
              if(on && row===1){ g.fillStyle='#ff1a1a'; g.shadowColor='#ff1a1a'; g.shadowBlur=lw*0.8; } else { g.fillStyle='#2a0707'; g.shadowBlur=0; }
              g.fill(); g.shadowBlur=0; }
          }
        }
        // ----- spegnimento: lampo -----
        if(t >= OUT && t < OUT + 0.35){ g.fillStyle = `rgba(255,255,255,${0.85*(1-(t-OUT)/0.35)})`; g.fillRect(0,0,W,H); }
        if(t >= OUT){
          const u = t - OUT;
          // telecamera: pista inclinata che ruota piano e si raddrizza verso il logo
          const tilt = Math.max(0.2, 1.05 - u*0.16), rot = tall ? 1.42 + u*0.04 : -0.5 + u*0.12, zoom = 1 + Math.max(0, 1.4 - u)*(tall ? 0.15 : 0.35);
          const proj = ([x,y]) => { const cx = x*Math.cos(rot) - y*Math.sin(rot), cy = x*Math.sin(rot) + y*Math.cos(rot);
            if(tall){ const z = cx*Math.sin(tilt*0.7), s = 2.2/(2.2 + z); return [W/2 + cx*Math.cos(tilt*0.7)*R*s*zoom, H/2 + cy*R*s*zoom, s]; }
            const z = cy*Math.sin(tilt), s = 2.2/(2.2 + z); return [W/2 + cx*R*s*zoom, H/2 + 30 + cy*Math.cos(tilt)*R*s*zoom, s]; };
          if(shake > 0){ g.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake); shake *= 0.86; }
          // la pista si disegna come una scia di luce
          const drawn = Math.min(1, u/0.9);
          g.lineCap = 'round'; g.lineJoin = 'round';
          for(const [w,col,blur] of [[14,'rgba(225,6,0,.18)',30],[5,'#e10600',18],[1.6,'#ffd6d4',0]]){
            g.strokeStyle = col; g.lineWidth = w; g.shadowColor = '#e10600'; g.shadowBlur = blur; g.beginPath();
            const n = Math.floor(drawn*N); for(let i=0;i<=n;i++){ const p = proj(P[i%N]); i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]); } g.stroke(); }
          g.shadowBlur = 0;
          // auto con le scie
          if(u > 0.25){
            const lapS = 2.6;   // secondi per giro
            for(const c of cars){ c.f += dt/lapS * vAt(c.f) * c.k * 1.25; c.tr.push(at(c.f)); if(c.tr.length > 26) c.tr.shift(); }
            for(const c of cars){
              for(let i=1;i<c.tr.length;i++){ const a=proj(c.tr[i-1]), b=proj(c.tr[i]); g.strokeStyle=c.col; g.globalAlpha=i/c.tr.length*0.8; g.lineWidth=5*b[2]; g.beginPath(); g.moveTo(a[0],a[1]); g.lineTo(b[0],b[1]); g.stroke(); }
              g.globalAlpha=1; const p = proj(c.tr[c.tr.length-1]); g.fillStyle=c.col; g.shadowColor=c.col; g.shadowBlur=18; g.beginPath(); g.arc(p[0],p[1],6*p[2],0,7); g.fill(); g.shadowBlur=0;
            }
          }
          g.setTransform(dpr,0,0,dpr,0,0);
        }
        // ----- logo -----
        if(t >= LOGO){
          const v = t - LOGO, k = v < 0.22 ? 2.6 - 1.6*(v/0.22) : 1;
          if(v < 0.05) shake = 26;
          g.fillStyle = `rgba(5,6,10,${Math.min(0.55, v*1.5)})`; g.fillRect(0,0,W,H);
          const fz = Math.min(120, W/8.5)*k; g.save(); g.translate(W/2, H/2 - fz*0.1); g.font = `italic 900 ${fz}px "Titillium Web","Segoe UI",sans-serif`; g.textBaseline='middle';
          const a = 'FREE', b = ' TO RACE', wa = g.measureText(a).width, wb = g.measureText(b).width, x = -(wa+wb)/2;
          g.globalAlpha = Math.min(1, v*6); g.shadowColor='#e10600'; g.shadowBlur=30; g.fillStyle='#e10600'; g.fillText(a, x, 0); g.shadowBlur=12; g.shadowColor='#000'; g.fillStyle='#fff'; g.fillText(b, x+wa, 0);
          g.restore();
          if(v > 0.5){ g.globalAlpha = Math.min(1,(v-0.5)*2); g.fillStyle='#c9cfdb'; g.font = `600 ${Math.max(15, Math.min(26, W/34))}px "Titillium Web","Segoe UI",sans-serif`; g.textAlign='center';
            g.fillText(L('Ogni auto. Ogni distacco. In diretta.','Every car. Every gap. Live.'), W/2, H/2 + Math.min(120,W/8.5)*0.75); g.textAlign='left'; g.globalAlpha=1; }
        }
        if(t >= END) return close();
        raf = requestAnimationFrame(frame);
      };
      raf = requestAnimationFrame(frame);
    }
  });
}

  const D = doc.drivers || {}, drv = n => { const d = D[n] || {}; return `<td class="l"><span class="sw" style="background:${esc(d.color||'#555')}"></span><span class="b">${esc(d.tla||n)}</span></td>`; };
  let head, rows;
  if(doc.kind === 'race'){
    head = [t('rPos'), t('rDrv'), t('rStart'), t('rChg'), t('gap'), t('rPts')];
    rows = (doc.arrivo || []).slice(0, 5).map(a => `<tr><td>${a.pos}</td>${drv(a.n)}<td>${a.grid ?? ''}</td><td class="${a.delta>0?'up':a.delta<0?'dn':''}">${a.delta>0?'▲'+a.delta:a.delta<0?'▼'+(-a.delta):a.delta===0?'=':''}</td><td>${esc(a.gap||'')}</td><td>${a.pts||''}</td></tr>`);
  } else if(doc.kind === 'quali'){
    head = [t('rPos'), t('rDrv'), t('rTime'), t('gap')];
    rows = (doc.griglia || []).slice(0, 5).map(a => `<tr><td>${a.pos}</td>${drv(a.n)}<td>${fmtRT(a.q3 ?? a.q2 ?? a.q1)}</td><td>${a.gap ? '+' + a.gap.toFixed(3) : ''}</td></tr>`);
  } else {
    head = [t('rPos'), t('rDrv'), t('rTime'), t('gap')];
    rows = (doc.classifica || []).slice(0, 5).map(a => `<tr><td>${a.pos}</td>${drv(a.n)}<td>${fmtRT(a.best)}</td><td>${a.gap ? '+' + a.gap.toFixed(3) : ''}</td></tr>`);
  }
  if(!rows.length) return '';
  const f = doc.giroVeloce, fd = f && D[f.n];
  return `<div class="ris top5"><h3>${esc(gpYear(doc.meeting, doc.year))} · ${esc(t('sess')[doc.session]||doc.session)}${doc.provvisoria ? ` <span class="prov">${t('prov')}</span>` : ''}</h3>
    <div class="rw"><table><tbody><tr>${head.map((x,i) => `<th class="${i===1?'l':''}">${x}</th>`).join('')}</tr>${rows.join('')}</tbody></table>
    <button class="all" data-full="1">${t('allRows')}</button></div>
    ${fd ? `<div class="tile">${t('rFl')}: <b>${esc(fd.tla)}</b> ${fmtRT(f.t)} <span class="dim">· ${t('rLap')} ${f.lap??''}</span></div>` : ''}</div>`;
}
async function loadRis(){
  if(DEMO || !window.FTRRis) return;
  try{
    const [idx, rp] = await Promise.all([fetch('../risultati/index.json', {cache:'no-cache'}).then(r => r.json()),
                                         fetch('../replay/replays.json', {cache:'no-cache'}).then(r => r.json()).catch(() => [])]);
    const sig = JSON.stringify(idx.map(x => x.name)) + rp.length;
    if(RIS.ok && sig === RIS.sig) return;                              // niente di nuovo
    RIS.sig = sig; RIS.idx = idx; RIS.replays = new Set(rp.map(x => x.name)); RIS.rplist = rp; RIS.ok = true;
    for(const [k, d] of Object.entries(RIS.docs)) if(d && d.provvisoria) delete RIS.docs[k];   // i provvisori si rileggono
    if((!RIS.cur || !RIS.picked) && idx.length) RIS.cur = idx[0].name; // l'ultima sessione pubblicata, se non se n'e' scelta una
    render(); drawRis();
  }catch(e){}
}
// 06.11, FP2 di San Paolo: l'app aperta prima della pubblicazione restava sulle Libere 1 (risultati letti una volta sola,
// all'apertura). Si rileggono ogni 5 minuti fuori dalla diretta, al ritorno in primo piano e quando finisce una sessione.
setInterval(() => { if(!document.hidden && !isLive()) loadRis(); }, 300e3);
setInterval(() => { if(!document.hidden && postWait(String((ST.SessionInfo||{}).SessionStatus || curStatus()))) loadRis(); }, 60e3);   // fine sessione: si aspetta la sua pubblicazione
document.addEventListener('visibilitychange', () => { if(!document.hidden && !isLive()) loadRis(); });
function risWeek(){                     // risultati del weekend in programma, o dell'ultimo weekend pubblicato
  if(!RIS.idx.length) return {same: false, items: []};
  const near = x => weekend && Math.abs(Date.parse(x.start) - weekend.sessions[0].d) < 5*86400e3;
  const same = RIS.idx.filter(near).sort((a, b) => (a.start || '').localeCompare(b.start || ''));
  if(same.length) return {same: true, items: same};
  const k = RIS.idx[0].year + RIS.idx[0].meeting;
  return {same: false, items: RIS.idx.filter(x => x.year + x.meeting === k).sort((a, b) => (a.start || '').localeCompare(b.start || ''))};
}
async function drawRis(){
  const box = $('#ris');
  if(DEMO){ box.innerHTML = ''; return; }
  // senza i risultati (index.json non raggiungibile): prossima sessione e demo
  if(!RIS.ok){ box.innerHTML = (nextSess ? nextHtml(null) : `<div class="nxc"><div class="kick">${t('noSession')}</div><div class="l2">${t('loadingCal')}</div></div>`) + demoBtn() + `<div id="wdc">${wdcHtml()}</div><div class="uffI">${t('uff')}</div>`; return; }
  const wk = risWeek();
  const show = RIS.cur && wk.items.some(x => x.name === RIS.cur) ? RIS.cur : (wk.items.length ? wk.items[wk.items.length - 1].name : null);
  RIS.cur = show;
  const last = wk.same && wk.items.length ? wk.items[wk.items.length - 1] : null;
  let h = nextHtml(wk) + (last && RIS.replays.has(last.name) ? lastBtn(last) : demoBtn());
  if(wk.items.length) h += `<div class="rhd"><b>${last && show === last.name ? `${t('wkLast')} · ${esc(t('sess')[last.session]||last.session)}` : `${t(wk.same ? 'thisWk' : 'lastWk')} · ${esc(gpName(wk.items[0].meeting))}`}</b><a href="../risultati/${show ? '?s=' + encodeURIComponent(show) : ''}">${t('risAll')} →</a></div>`;
  box.innerHTML = h + `<div id="risBody"></div><div id="wdc">${wdcHtml()}</div><div class="uffI">${t('uff')}</div>`;
  if(!show) return;
  box.querySelectorAll('[data-ris]').forEach(b => b.classList.toggle('on', b.dataset.ris === show));
  try{
    const doc = RIS.docs[show] || (RIS.docs[show] = await (await fetch(`../risultati/${encodeURIComponent(show)}.json`, {cache:'no-cache'})).json());
    if(RIS.cur !== show) return;
    const body = $('#risBody'); if(!body) return;
    if(RIS.full === show){   // ordine completo e il resto dei risultati, senza «Rivedi la sessione» (la demo sta sopra)
      FTRRis.render(body, doc, LANG, {sessName: t('sess')[doc.session] || doc.session, replay: null});
      body.insertAdjacentHTML('beforeend', `<button class="less" data-full="0">${t('lessRows')}</button>`);
    } else { if(!document.getElementById('risCss')) FTRRis.render(document.createElement('div'), doc, LANG, {});   // lo stile delle tabelle lo mette risultati.js al primo disegno
      body.innerHTML = top5Html(doc) || (FTRRis.render(body, doc, LANG, {sessName: t('sess')[doc.session] || doc.session, replay: null}), body.innerHTML); }
  }catch(e){ const b = $('#risBody'); if(b) b.innerHTML = ''; }
}
$('#ris').addEventListener('click', e => {
  const w = e.target.closest('[data-wdc]');
  if(w){ const v = w.dataset.wdc; if(v === 'all') WDC.all = !WDC.all; else WDC.tab = v; store.set('ftr.wdcTab', WDC.tab); drawWdc(); return; }
  const f = e.target.closest('[data-full]');
  if(f){ const open = f.dataset.full === '1'; RIS.full = open ? RIS.cur : null; drawRis().then(() => { if(!open) $('#ris .rhd') && $('#ris .rhd').scrollIntoView({block:'start'}); }); return; }
  const b = e.target.closest('[data-ris]'); if(!b) return; RIS.cur = b.dataset.ris; RIS.picked = true; RIS.full = null; drawRis(); });
loadRis();

// Mondiale piloti e costruttori (Jolpica), sotto l'ultimo weekend nella scheda Tempi; senza risposta non compare
const TEAMC = {mercedes:'#00D7B6', ferrari:'#ED1131', red_bull:'#4781D7', mclaren:'#F47600', rb:'#6C98FF', alpine:'#00A1E8',
  haas:'#9C9FA2', audi:'#F50537', sauber:'#01C00E', williams:'#1868DB', aston_martin:'#229971', cadillac:'#909090'};
const TEAMN = {red_bull:'Red Bull Racing', rb:'Racing Bulls', haas:'Haas', alpine:'Alpine', cadillac:'Cadillac', sauber:'Sauber'};
const teamName = c => TEAMN[c.constructorId] || String(c.name || '').replace(/ F1 Team$/, '');
function wdcHtml(){
  if(!WDC.d && !WDC.c) return '';
  const drv = WDC.tab !== 'c' && !!WDC.d, list = drv ? WDC.d : WDC.c; if(!list || !list.length) return '';
  const lead = +list[0].points, rows = (WDC.all ? list : list.slice(0, 5)).map(x => {
    const c = drv ? (x.Constructors || []).slice(-1)[0] || {} : x.Constructor || {}, gap = +x.points - lead;
    const who = drv ? `<b>${esc(x.Driver.code || x.Driver.familyName)}</b> <span class="dim">${esc(x.Driver.familyName)}</span>` : `<b>${esc(teamName(c))}</b>`;
    return `<tr><td>${esc(x.positionText || x.position)}</td><td class="l"><span class="sw" style="background:${TEAMC[c.constructorId] || '#555'}"></span>${who}</td><td class="pt">${esc(x.points)}</td><td class="dim">${gap ? '−' + (-gap) : ''}</td><td class="dim">${esc(x.wins)}</td></tr>`; });
  const after = WDC.round ? (WDC.races >= WDC.round ? t('wdcAfter').replace('{n}', WDC.races) : t('wdcAfter1')).replace('{r}', WDC.round) : '';
  const tab = (k, l) => `<button data-wdc="${k}" class="${(k === 'c') === !drv ? 'on' : ''}">${t(l)}</button>`;
  return `<div class="wdc"><div class="wh"><b>${t('wdcH')}</b><span>${after}</span>${list.length > 5 ? `<button data-wdc="all">${t(WDC.all ? 'wdcLess' : 'wdcAll')}</button>` : ''}</div>
    <div class="tg">${WDC.d ? tab('d', 'wdcD') : ''}${WDC.c ? tab('c', 'wdcC') : ''}</div>
    <table><tbody><tr><th>${t('rPos')}</th><th class="l">${t(drv ? 'rDrv' : 'wdcTeam')}</th><th>${t('rPts')}</th><th></th><th>${t('wdcWins')}</th></tr>${rows.join('')}</tbody></table></div>`;
}
function drawWdc(){ const b = $('#wdc'); if(b) b.innerHTML = wdcHtml(); }
async function loadWdc(){
  if(DEMO) return;
  const get = async k => { const ac = new AbortController(), tm = setTimeout(() => ac.abort(), 15e3);
    try{ const r = await (await fetch(`https://api.jolpi.ca/ergast/f1/current/${k}/?limit=40`, {signal: ac.signal})).json();
      const L = r.MRData.StandingsTable.StandingsLists[0]; return L ? {round: +L.round || 0, list: L.DriverStandings || L.ConstructorStandings || []} : null; }
    catch(e){ return null; } finally{ clearTimeout(tm); } };
  const [d, c] = await Promise.all([get('driverStandings'), get('constructorStandings')]);
  if(d){ WDC.d = d.list; WDC.round = d.round; } if(c){ WDC.c = c.list; WDC.round = Math.max(WDC.round, c.round); }
  if(!WDC.d && WDC.tab === 'd') WDC.tab = 'c'; if(!WDC.c && WDC.tab === 'c') WDC.tab = 'd';
  drawWdc();
}
loadWdc();
setInterval(() => { if(!document.hidden && !isLive()) loadWdc(); }, 1800e3);   // dopo una gara la classifica si aggiorna da sola

// ---------------- avvisi per le bandiere, schermo acceso, classifica compatta ----------------
const opt = k => store.get('ftr.' + k, '1') === '1';
let prevFlag, flagTimer = 0;
function flagAlert(ts){
  if(ts == null){ prevFlag = undefined; return; }
  const was = prevFlag; prevFlag = ts;
  if(was === undefined || was === ts || !opt('vib')) return;
  const big = ['4', '5', '6'].includes(ts), clear = ts === '1' && ['4', '5', '6', '7'].includes(was);
  if(!big && !clear) return;
  const c = TRACKC[ts] || ['#1f9d55', '#fff'], b = $('#flagBan');
  b.textContent = String(t('track')[ts] || '').toUpperCase();
  b.style.background = c[0]; b.style.color = c[1]; b.classList.add('on');
  clearTimeout(flagTimer); flagTimer = setTimeout(() => b.classList.remove('on'), big ? 5000 : 3000);
  try{ if(navigator.vibrate) navigator.vibrate(big ? [250, 120, 250, 120, 250] : [150]); }catch(e){}
}
$('#flagBan').onclick = () => $('#flagBan').classList.remove('on');
let wl = null, wlBusy = false;
async function wakeLock(){
  const want = opt('wake') && !document.hidden && (DEMO ? !!(rp && !rp.paused) : isLive());
  if(wlBusy || !('wakeLock' in navigator) || want === !!wl) return;
  wlBusy = true;
  try{ if(want){ wl = await navigator.wakeLock.request('screen'); wl.addEventListener('release', () => { wl = null; }); } else { await wl.release(); wl = null; } }
  catch(e){ wl = null; }
  wlBusy = false;
}
document.addEventListener('visibilitychange', () => { wl = null; wakeLock(); });   // il sistema lo toglie quando l'app va in secondo piano
// la classifica in diretta e' sempre una riga per pilota (scheda al tocco): l'opzione «compatta» non serve piu'
$('[data-opt="dense"]').closest('.opt').style.display = 'none';
function applyOpts(){ document.body.classList.toggle('dense', opt('dense')); $$('[data-opt]').forEach(i => i.checked = opt(i.dataset.opt)); }
$$('[data-opt]').forEach(i => i.onchange = () => { store.set('ftr.' + i.dataset.opt, i.checked ? '1' : '0'); applyOpts(); wakeLock(); });
applyOpts();

// ---------------- installazione sulla schermata Home ----------------
// Chrome/Android: si tiene da parte l'invito del browser e lo si apre col pulsante, un tocco solo.
// iPhone: nessun sito puo' installare da se', si mostrano i tre passi di Safari. Nei browser interni
// (Instagram, Facebook) non si installa: si spiega come aprire il browser vero.
const UA = navigator.userAgent;
const STANDALONE = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const IOS = /iPhone|iPad|iPod/i.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const ANDROID = /Android/i.test(UA);
const INAPP = /Instagram|FBAN|FBAV|FB_IAB|Line\/|TikTok|musical_ly|; wv\)/i.test(UA);
const IOS_SAFARI = IOS && !/CriOS|FxiOS|EdgiOS|OPiOS/i.test(UA) && !INAPP;
let instEvt = null;
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); instEvt = e; if($('#instSheet').classList.contains('on')) instSheet(); });
window.addEventListener('appinstalled', () => { instEvt = null; instClose(); $('#instBar').classList.remove('on'); toast(t('instDone')); });
function instSheet(){
  let h = `<h3><img src="icon-192.png" alt="">${t('instH')}</h3><div class="dim" style="font-size:14px">${t('instOk')}</div>`;
  const steps = a => `<ol>${a.map(x=>`<li>${x}</li>`).join('')}</ol>`;
  if(instEvt) h += `<button class="btn main go" id="instGo">${t('instGo')}</button>`;
  else if(INAPP) h += `<p style="font-size:15px">${t('instInApp')}</p>`;
  else if(IOS) h += (IOS_SAFARI ? '' : `<p style="font-size:15px">${t('instIosOther')}</p>`) + steps(t('instIos'));
  else if(ANDROID) h += steps(t('instAnd'));
  else h += `<img class="qr" src="../img/qr_live.svg" alt="QR free-to-race.com/live"><p style="font-size:14px;text-align:center">${t('instPc')}</p>
    <p class="dim" style="font-size:13px;text-align:center">${t('instPcProg')} <a href="https://github.com/Nik88nk/freetorace/releases/latest/download/FreeToRace-Setup.exe" style="color:var(--text)">${t('pcDl')}</a></p>`;
  h += `<button class="close" id="instC">${t('instClose')}</button>`;
  $('#instBox').innerHTML = h;
  $('#instSheet').classList.add('on');
}
function instClose(){ $('#instSheet').classList.remove('on'); }
async function install(){
  if(!instEvt) return instSheet();
  const e = instEvt; instEvt = null;
  e.prompt(); try{ await e.userChoice; }catch(x){}
  instClose();
}
document.addEventListener('click', e => {
  if(e.target.closest('[data-install]') || e.target.closest('#instGo')){ e.preventDefault(); install(); }
  else if(e.target.closest('#instC') || e.target.id === 'instSheet') instClose();
  else if(e.target.closest('#instX')){ $('#instBar').classList.remove('on'); store.set('ftr.instX', Date.now()); }
});
const INSTALL_ASK = new URLSearchParams(location.search).has('install');   // arrivati dal pulsante del sito
if(STANDALONE) $('#instSet').style.display = 'none';
else if(INSTALL_ASK) $('#instBar').classList.add('on');   // 04.11: in apertura niente invito a installare, che sta in Impostazioni; solo arrivando dal pulsante del sito

texts(); showDelay(); render();
if(DEMO){ startDemo(); $$('[data-d]').forEach(b => { const st = b.closest('.set'); if(st) st.style.display='none'; }); }
else { loadNext(); connect();
  // prima apertura: l'intro, ma non se c'e' una sessione in diretta (chi apre al volo vuole i tempi)
  // ne' se si e' arrivati per installare: prima la finestra con il pulsante
  if(INSTALL_ASK && !STANDALONE) setTimeout(instSheet, 800);   // un attimo per l'invito di Chrome
  else setTimeout(() => { if(!isLive()) playIntro(false); }, 2500); }
</script>
