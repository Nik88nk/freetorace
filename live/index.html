<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Free to Race Live — F1 live timing on your phone</title>
<link rel="canonical" href="https://free-to-race.com/live/">
<meta name="description" content="Free F1 live timing and track map on your phone. Unofficial fan project.">
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Free to Race">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d12;--panel:#14181f;--panel2:#1b2029;--line:#262c37;--line2:#1d222b;--text:#eef1f6;--dim:#8b94a7;--dim2:#5d6577;
  --accent:#e10600;--purple:#b46cff;--green:#22d36b;--yellow:#ffd12e;--blue:#3d8bff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font:15px/1.35 "Titillium Web","Segoe UI",system-ui,sans-serif}
body{display:flex;flex-direction:column;overflow:hidden}
.tn{font-variant-numeric:tabular-nums}
.dim{color:var(--dim)}
header{padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;background:#08090d;border-bottom:3px solid var(--accent);display:flex;align-items:center;gap:10px}
header .ev{flex:1;min-width:0}
header .ev b{display:block;font-size:16px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .ev small{color:var(--dim);font-size:12px;text-transform:uppercase;letter-spacing:.8px}
.lap{text-align:right;font-weight:900;font-size:22px;line-height:1}
.lap small{display:block;font-size:10px;color:var(--dim);letter-spacing:1px;font-weight:700}
.pill{font-size:11px;font-weight:900;padding:3px 8px;border-radius:5px;text-transform:uppercase;white-space:nowrap}
#conn{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--dim);padding:5px 12px;background:#0f1218;border-bottom:1px solid var(--line2)}
#conn i{width:8px;height:8px;border-radius:50%;background:#555;display:inline-block}
#conn.on i{background:var(--green);box-shadow:0 0 8px var(--green)}
#conn .grow{flex:1}
main{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.pane{display:none}
.pane.on{display:block}
nav{display:flex;border-top:1px solid var(--line);background:#08090d;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:none;color:var(--dim);font:inherit;font-size:12px;font-weight:700;padding:9px 0 8px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button span{font-size:19px;line-height:1}
nav button.on{color:var(--text);box-shadow:inset 0 3px 0 var(--accent)}
.row{display:grid;grid-template-columns:26px 4px 46px 1fr 74px 40px;align-items:center;gap:8px;padding:7px 12px;border-bottom:1px solid var(--line2)}
.row.sel{background:#1a2030}
.row .p{font-weight:900;text-align:right}
.row .bar{height:22px;border-radius:2px}
.row .t{font-weight:900}
.row .t small{display:block;color:var(--dim);font-weight:600;font-size:11px}
.row .g{text-align:right;font-size:14px}
.row .g small{display:block;color:var(--dim);font-size:11px}
.row .l{text-align:right;font-size:13px}
.row .l.pb{color:var(--green)}.row .l.ob{color:var(--purple)}
.tyre{display:flex;align-items:center;justify-content:flex-end;gap:3px;font-size:12px}
.ti{width:20px;height:20px;border-radius:50%;border:3px solid;display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:9px;background:#0c0e12}
.tag{font-size:9px;font-weight:900;padding:1px 4px;border-radius:3px;margin-left:4px;vertical-align:2px}
.tag.pit{background:var(--blue);color:#fff}.tag.out{background:#555;color:#fff}
.mini{display:flex;gap:1px;margin-top:3px}
.mini i{height:3px;flex:1;border-radius:1px;background:#2b313c}
.head{display:grid;grid-template-columns:26px 4px 46px 1fr 74px 40px;gap:8px;padding:6px 12px;font-size:10px;letter-spacing:1px;color:var(--dim);text-transform:uppercase;font-weight:700;border-bottom:1px solid var(--line)}
.head span:nth-child(4),.head span:nth-child(5),.head span:nth-child(6){text-align:right}
.seg{display:flex;gap:4px;padding:8px 12px}
.seg button{flex:1;background:var(--panel2);border:1px solid var(--line);color:var(--dim);border-radius:7px;padding:6px;font:inherit;font-size:12px;font-weight:700}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
#mapBox{position:relative;height:min(92vw,52vh);min-height:260px}
#v3d{position:absolute;top:8px;right:8px;background:var(--panel2);border:1px solid var(--line);color:var(--dim);border-radius:7px;padding:5px 11px;font:inherit;font-size:12px;font-weight:700}
#v3d.on{background:var(--accent);border-color:var(--accent);color:#fff}
.crow{display:grid;grid-template-columns:24px 4px 44px 1fr 44px;gap:8px;align-items:center;padding:5px 12px;border-bottom:1px solid var(--line2);font-size:14px}
.crow.sel{background:#1a2030}
.crow .p{font-weight:900;text-align:right}.crow .bar{height:16px;border-radius:2px}.crow .t{font-weight:900}.crow .g{text-align:right}
nav em{font-style:normal}
#map{width:100%;height:100%;display:block}
.note{color:var(--dim);font-size:12px;padding:8px 12px}
.msg{padding:9px 12px;border-bottom:1px solid var(--line2);display:flex;gap:8px;font-size:13px}
.msg .f{width:6px;border-radius:2px;flex:none}
.msg .w{color:var(--dim);font-size:11px;min-width:44px}
.idle{padding:26px 16px 18px;text-align:center}
.idle .kick{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);font-weight:900}
.idle h2{margin:6px 0 4px;font-size:24px;line-height:1.15}
.idle .when{color:var(--dim);font-size:14px}
.cdg{display:flex;justify-content:center;gap:8px;margin:20px 0 22px}
.cdg div{background:var(--panel2);border:1px solid var(--line);border-radius:12px;min-width:66px;padding:10px 4px 8px}
.cdg b{display:block;font-size:34px;font-weight:900;line-height:1}
.cdg small{display:block;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);margin-top:5px}
.idle .btn.big{display:block;max-width:320px;margin:0 auto;padding:14px 16px;font-size:16px}
.idle .sub{color:var(--dim);font-size:12px;margin-top:6px}
.idle .last{color:var(--dim2);font-size:12px;margin-top:22px}
.idle .where{color:var(--dim);font-size:13px;margin-top:2px}
.wk{max-width:360px;margin:24px auto 0;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.wk h4{margin:0;padding:10px 14px;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--line2)}
.wk div{display:flex;justify-content:space-between;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line2);font-size:14px}
.wk div:last-child{border-bottom:0}
.wk .done{color:var(--dim2)}
.wk .nx{background:#1a2030;font-weight:700}.wk .nx span:first-child{color:var(--accent)}
.idle .acts{display:flex;justify-content:center;gap:8px;margin-top:14px;flex-wrap:wrap}
.idle .acts .btn{margin:0;font-size:14px}
.btn{display:inline-block;padding:10px 16px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);color:var(--text);text-decoration:none;font-weight:700;margin:4px}
.btn.main{background:var(--accent);border-color:var(--accent)}
.set{padding:14px 12px;border-bottom:1px solid var(--line2)}
.set h4{margin:0 0 8px;font-size:13px;letter-spacing:1px;text-transform:uppercase;color:var(--dim)}
.delay{display:flex;align-items:center;gap:8px}
.delay button{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:8px;padding:8px 12px;font:inherit;font-weight:700}
.delay b{font-size:22px;min-width:64px;text-align:center}
#rpBar{display:flex;align-items:center;gap:8px;padding:6px 12px;background:#0f1218;border-bottom:1px solid var(--line2)}
#rpBar button{background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:7px;padding:5px 10px;font:inherit;font-weight:700;min-width:44px}
#rpBar input{width:100%;accent-color:var(--accent)}
.rpSeekW{flex:1;position:relative;display:flex;align-items:center}
#rpMarks{position:absolute;left:8px;right:8px;bottom:-4px;height:4px;pointer-events:none}
#rpMarks i{position:absolute;top:0;height:4px;border-radius:2px}
#rpMarks i.red{background:#e10600}#rpMarks i.sc{background:#ff9f1a}#rpMarks i.vsc{background:#ffd12e}
#rpMarks b{position:absolute;top:-3px;width:2px;height:10px;background:#fff}
#rpNote{display:none;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 12px;font-size:14px;border-bottom:1px solid var(--line2);border-left:5px solid}
#rpNote.red{display:flex;background:linear-gradient(90deg,#5a0b0b,#240909);border-left-color:#e10600}
#rpNote.grid{display:flex;background:linear-gradient(90deg,#14233b,#0d121c);border-left-color:#2f6fd1}
#rpNote.go{display:flex;background:linear-gradient(90deg,#0f3a22,#0b1510);border-left-color:#22d36b}
#rpNote b.h{font-size:16px;font-weight:900}
#rpNote .cd{font-weight:900;font-size:17px}
#rpNote button{margin-left:auto;background:#fff;color:#111;border:none;border-radius:8px;padding:7px 12px;font:inherit;font-weight:900}
#rpNote .lights{display:inline-flex;gap:4px}
#rpNote .lights i{width:12px;height:12px;border-radius:50%;background:#2a0505;border:1px solid #000}
#rpNote .lights i.on{background:#ff1a1a;box-shadow:0 0 8px #ff1a1a}
#rpTime{font-size:12px;color:var(--dim)}
#rpLoad{position:fixed;inset:0;z-index:9;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px}
#rpLoad img{width:72px;height:72px;border-radius:14px}#rpLoad span{color:var(--dim)}
#intro{position:fixed;inset:0;z-index:200;background:#05060a;transition:opacity .6s ease}
#intro.out{opacity:0}
#intro canvas{position:absolute;inset:0;width:100%;height:100%}
#intro .skip{position:absolute;right:22px;bottom:22px;background:transparent;border:1px solid #262c37;color:#8b94a7;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer;z-index:2}
#intro .skip:hover{color:#fff}
footer{font-size:11px;color:var(--dim2);padding:16px 12px 24px;line-height:1.4}
#ris{padding:4px 12px 0}#ris .rhd{display:flex;align-items:baseline;gap:8px;margin:14px 0 6px}#ris .rhd b{font-size:13px;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent)}#ris .rhd a{margin-left:auto;font-size:13px;color:var(--dim)}
#ris .chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}#ris .chips button{flex:none;border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:12px;padding:6px 11px;font:inherit;font-size:13px;font-weight:700;text-align:left;line-height:1.2}#ris .chips button small{display:block;font-size:11px;font-weight:600;color:var(--dim)}#ris .chips button.on{background:var(--accent);border-color:var(--accent);color:#fff}#ris .chips button.on small{color:#ffe1df}#ris .chips button.nx{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}#ris .chips button:disabled{opacity:1;color:var(--dim)}#ris .chips button.past{opacity:.55}#ris .nx1{text-align:center;padding:12px 0 2px}#ris .nx1 .kick{font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--accent);font-weight:900}#ris .nxl{font-size:17px;margin-top:4px}#ris .nxl b{font-size:19px}#ris .nx1 .where{color:var(--dim);font-size:13px}#ris .cdg{margin:10px 0 4px;gap:6px}#ris .cdg div{min-width:56px;padding:7px 3px 6px;border-radius:10px}#ris .cdg b{font-size:26px}#ris .cdg small{font-size:9px;margin-top:3px}
#instBar{display:none;align-items:center;gap:10px;padding:8px 12px;background:linear-gradient(90deg,#3a0a0a,#14181f);border-bottom:1px solid var(--line2);font-size:14px}
#instBar.on{display:flex}
#instBar img{width:28px;height:28px;border-radius:6px}
#instBar span{flex:1;line-height:1.2}
#instBar button{background:var(--accent);border:none;color:#fff;border-radius:8px;padding:7px 14px;font:inherit;font-weight:900}
#instBar button.x{background:none;color:var(--dim);padding:4px 6px;font-size:18px}
#instSheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center}
#instSheet.on{display:flex}
#instSheet .box{background:var(--panel);border:1px solid var(--line);border-radius:16px 16px 0 0;width:100%;max-width:480px;padding:18px 18px calc(env(safe-area-inset-bottom) + 18px)}
#instSheet h3{margin:0 0 4px;font-size:20px;display:flex;align-items:center;gap:10px}
#instSheet h3 img{width:36px;height:36px;border-radius:8px}
#instSheet ol{margin:12px 0 4px;padding-left:22px;font-size:15px;line-height:1.5}
#instSheet ol li{margin-bottom:8px}
#instSheet .k{display:inline-block;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:0 6px;font-weight:700;white-space:nowrap}
#instSheet .go{display:block;width:100%;margin:14px 0 0;padding:14px;font-size:17px;text-align:center;border:none;font-family:inherit}
#instSheet .qr{display:block;margin:12px auto;width:180px;height:180px;border-radius:10px}
#instSheet .close{display:block;margin:10px auto 0;background:none;border:none;color:var(--dim);font:inherit;font-size:14px}
/* testata su una riga: luogo · sessione, tempo/giro a destra; la barra di stato compare solo se serve */
header{padding:calc(env(safe-area-inset-top) + 6px) 12px 6px}
/* iPhone con la pagina sotto l'orologio (icona aggiunta prima del 27.10): iOS 26 sfoca una fascia sotto l'orologio, la testata scende sotto */
.iosvelo header{padding-top:calc(env(safe-area-inset-top) + 34px)}
header .ev b{font-size:15px}
#hdot{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);flex:none;display:none}
#hdot.on{display:block}
#conn.hide{display:none}
/* classifica compatta: una riga per pilota; squadra e miglior tempo si aprono toccando la riga */
body.dense .row{padding:4px 12px;gap:6px}
body.dense .row .t small,body.dense .row .g small{display:none}
body.dense .row.sel .t small,body.dense .row.sel .g small{display:block}
body.dense .row .bar{height:18px}
body.dense .row .ti{width:18px;height:18px;border-width:2px}
body.dense .mini{margin-top:2px}
/* bandiere: avviso a tutta larghezza per qualche secondo */
#flagBan{position:fixed;left:0;right:0;top:0;z-index:60;display:none;padding:calc(env(safe-area-inset-top) + 16px) 16px 16px;text-align:center;font-size:26px;font-weight:900;letter-spacing:1px;box-shadow:0 8px 30px rgba(0,0,0,.5)}
#flagBan.on{display:block;animation:fbIn .25s ease-out}
@keyframes fbIn{from{transform:translateY(-100%)}to{transform:none}}
.opt{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:14px}
.opt input{width:20px;height:20px;accent-color:var(--accent);flex:none}
</style>
<script data-goatcounter="https://freetorace.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</head>
<body>
<div id="flagBan"></div>
<header>
  <img src="icon-192.png" alt="" style="width:26px;height:26px;border-radius:6px">
  <i id="hdot"></i>
  <div class="ev"><b id="ev">Free to Race</b><small id="ses">Live</small></div>
  <span class="pill" id="track" style="display:none"></span>
  <div class="lap tn" id="lap"></div>
</header>
<div id="instBar"><img src="icon-192.png" alt=""><span data-t="instBar"></span><button data-install="1" data-t="instShort"></button><button class="x" id="instX" aria-label="×">×</button></div>
<div id="instSheet"><div class="box" id="instBox"></div></div>
<div id="conn"><i></i><span id="connTxt"></span><span class="grow"></span><span id="delayTxt" class="tn"></span></div>
<div id="rpBar" style="display:none"><button id="rpPlay">⏸</button><button id="rpSpeed">1×</button><span class="rpSeekW"><input type="range" id="rpSeek" min="0" max="1000" value="0"><span id="rpMarks"></span></span><span id="rpTime" class="tn"></span></div>
<div id="rpNote"></div>
<div id="rpLoad" style="display:none"><img src="icon-192.png" alt=""><b>FREE TO RACE · DEMO</b><span id="rpMsg"></span></div>
<main>
  <div class="pane on" id="p-times">
    <div id="ris"></div>
    <div id="idle"></div>
    <div class="seg" id="gapMode"><button data-g="gap" class="on" data-t="gapLeader"></button><button data-g="int" data-t="gapAhead"></button></div>
    <div class="head" id="timesHead"><span>P</span><span></span><span data-t="driver"></span><span id="hGap" data-t="gap"></span><span data-t="last"></span><span data-t="tyre"></span></div>
    <div id="rows"></div>
  </div>
  <div class="pane" id="p-map"><div id="mapBox"><canvas id="map"></canvas><button id="v3d">3D</button></div><div class="note" id="mapNote"></div><div id="mapRows"></div></div>
  <div class="pane" id="p-rc"><div id="rc"></div></div>
  <div class="pane" id="p-set">
    <div class="set"><h4 data-t="delayH"></h4><div class="delay"><button data-d="-5">−5</button><b id="delayV" class="tn">0 s</b><button data-d="5">+5</button><button data-d="30">+30</button><button data-d="0" data-r="1">0</button></div>
      <p class="dim" style="font-size:13px" data-t="delayP"></p></div>
    <div class="set"><h4 data-t="viewH"></h4><label class="opt"><input type="checkbox" data-opt="dense"><span data-t="optDense"></span></label><label class="opt"><input type="checkbox" data-opt="wake"><span data-t="optWake"></span></label><label class="opt"><input type="checkbox" data-opt="vib"><span data-t="optVib"></span></label></div>
    <div class="set"><h4 data-t="langH"></h4><div class="seg" style="padding:0"><button data-l="en">English</button><button data-l="it">Italiano</button></div></div>
    <div class="set" id="instSet"><h4 data-t="homeH"></h4><a class="btn main" href="#" data-install="1" data-t="instBtn" style="margin:0"></a></div>
    <div class="set"><a class="btn main" href="../" data-t="pc"></a> <a class="btn" href="https://ko-fi.com/freetorace" data-t="coffee"></a> <a class="btn" href="#" data-share="1" data-t="share"></a></div>
    <div class="set"><a href="#" id="introBtn" style="color:var(--dim);font-size:13px;margin-right:16px" data-t="introAgain"></a><a href="#" id="bugBtn" style="color:var(--dim);font-size:13px;margin-right:16px" data-t="bug"></a><a href="../privacy/" style="color:var(--dim);font-size:13px" data-t="privacy"></a></div>
    <footer data-t="disc"></footer>
  </div>
</main>
<nav>
  <button data-tab="times" class="on"><span>⏱</span><em data-t="tTimes"></em></button>
  <button data-tab="map"><span>◎</span><em data-t="tMap"></em></button>
  <button data-tab="rc"><span>⚑</span><em data-t="tRc"></em></button>
  <button data-tab="set"><span>⚙</span><em data-t="tSet"></em></button>
</nav>
<script src="../risultati/risultati.js"></script>
<script>

function merge(base, upd){

    return base;

  // aggiunti dopo finiscono dentro l'evento e ricompaiono quando si torna indietro (audit 0.4.4 I1, 0.4.8 I4)
  if(Array.isArray(upd)) return upd.map(v => merge(null, v));

const INTRO_TEAMS = ['#27f4d2','#3671c6','#e8002d','#ff8000','#229971','#0093cc','#64c4ff','#6692ff','#b6babd','#52e252','#909090'];
function playIntro(force){
  return new Promise(async done => {
    if(!force && (store.get('ftr.intro','') === '1' || matchMedia('(prefers-reduced-motion: reduce)').matches)) return done();
    store.set('ftr.intro', '1');
    const ov = document.createElement('div'); ov.id = 'intro';
    ov.innerHTML = `<canvas></canvas><button class="skip">${L('Salta','Skip')} ✕</button>`;
    document.body.appendChild(ov);
    let raf = 0, closed = false;
    const close = () => { if(closed) return; closed = true; cancelAnimationFrame(raf); ov.classList.add('out');
      setTimeout(()=>{ ov.remove(); document.removeEventListener('keydown', key); done(); }, 650); };
    const key = e => { if(e.key==='Escape') close(); };
    document.addEventListener('keydown', key);
    ov.querySelector('.skip').onclick = close;
    run();

    function run(){
      // ---------- tempi (secondi) ----------
      const LIGHT = [0.4, 1.0, 1.6, 2.2, 2.8], OUT = 3.6 + Math.random()*0.5, LOGO = OUT + 3.1, END = LOGO + 2.4;

      // ---------- pista e auto ----------
      const P = []; for(let i=0;i<INTRO_TRACK.length;i+=2) P.push([INTRO_TRACK[i], INTRO_TRACK[i+1]]);
      const N = P.length;
      // velocita' lungo il giro: piu' lenta dove la pista curva di piu' (curvatura sui punti vicini, smussata)
      const curv = P.map((p,i) => { const a=P[(i-3+N)%N], b=P[(i+3)%N]; const a1=Math.atan2(p[1]-a[1],p[0]-a[0]), a2=Math.atan2(b[1]-p[1],b[0]-p[0]); let d=Math.abs(a2-a1); if(d>Math.PI) d=2*Math.PI-d; return d; });
      const spd = curv.map((_,i) => { let s=0; for(let k=-4;k<=4;k++) s+=curv[(i+k+N)%N]; return 1/(1+s*1.6); });
      const at = f => { const x=((f%1)+1)%1*N, i=Math.floor(x), r=x-i, a=P[i], b=P[(i+1)%N]; return [a[0]+(b[0]-a[0])*r, a[1]+(b[1]-a[1])*r]; };
      const vAt = f => spd[Math.floor(((f%1)+1)%1*N)];
      const cars = Array.from({length:22}, (_,i) => ({f: -0.009*i - 0.003*(i%2), col: INTRO_TEAMS[Math.floor(i/2)%INTRO_TEAMS.length], k: 1 + (Math.random()-0.5)*0.14 - i*0.004, tr: []}));

      const cv = ov.querySelector('canvas'), g = cv.getContext('2d');
      const t0 = performance.now(); let last = t0, shake = 0;
      const frame = now => {
        const dpr = window.devicePixelRatio||1, W = innerWidth, H = innerHeight;
        if(cv.width!==Math.round(W*dpr)){ cv.width=Math.round(W*dpr); cv.height=Math.round(H*dpr); }
        g.setTransform(dpr,0,0,dpr,0,0);
        const t = (now - t0)/1000, dt = Math.min(0.05, (now-last)/1000); last = now;
        g.fillStyle = '#05060a'; g.fillRect(0,0,W,H);
        // vignetta rossa che pulsa con le luci
        const tall = W < H, R = tall ? Math.min(H*0.34, W*0.86) : Math.min(W,H)*0.42;
        // ----- semafori -----
        if(t < OUT + 0.25){
          const lw = Math.min(110, W/8), gap = lw*0.28, x0 = W/2 - (5*lw+4*gap)/2, y = H/2 - lw/2;
          for(let i=0;i<5;i++){
            const on = t >= LIGHT[i] && t < OUT, x = x0 + i*(lw+gap);
            g.fillStyle = '#111318'; g.beginPath(); g.roundRect(x-8, y-lw*0.9, lw+16, lw*2.8, 14); g.fill();
            for(let row=0; row<2; row++){ const cy = y + row*lw*1.05;
              g.beginPath(); g.arc(x+lw/2, cy+lw/2-lw*0.35, lw*0.4, 0, 7);
              if(on && row===1){ g.fillStyle='#ff1a1a'; g.shadowColor='#ff1a1a'; g.shadowBlur=lw*0.8; } else { g.fillStyle='#2a0707'; g.shadowBlur=0; }
              g.fill(); g.shadowBlur=0; }
          }
        }
        // ----- spegnimento: lampo -----
        if(t >= OUT && t < OUT + 0.35){ g.fillStyle = `rgba(255,255,255,${0.85*(1-(t-OUT)/0.35)})`; g.fillRect(0,0,W,H); }
        if(t >= OUT){
          const u = t - OUT;
          // telecamera: pista inclinata che ruota piano e si raddrizza verso il logo
          const tilt = Math.max(0.2, 1.05 - u*0.16), rot = tall ? 1.42 + u*0.04 : -0.5 + u*0.12, zoom = 1 + Math.max(0, 1.4 - u)*(tall ? 0.15 : 0.35);
          const proj = ([x,y]) => { const cx = x*Math.cos(rot) - y*Math.sin(rot), cy = x*Math.sin(rot) + y*Math.cos(rot);
            if(tall){ const z = cx*Math.sin(tilt*0.7), s = 2.2/(2.2 + z); return [W/2 + cx*Math.cos(tilt*0.7)*R*s*zoom, H/2 + cy*R*s*zoom, s]; }
            const z = cy*Math.sin(tilt), s = 2.2/(2.2 + z); return [W/2 + cx*R*s*zoom, H/2 + 30 + cy*Math.cos(tilt)*R*s*zoom, s]; };
          if(shake > 0){ g.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake); shake *= 0.86; }
          // la pista si disegna come una scia di luce
          const drawn = Math.min(1, u/0.9);
          g.lineCap = 'round'; g.lineJoin = 'round';
          for(const [w,col,blur] of [[14,'rgba(225,6,0,.18)',30],[5,'#e10600',18],[1.6,'#ffd6d4',0]]){
            g.strokeStyle = col; g.lineWidth = w; g.shadowColor = '#e10600'; g.shadowBlur = blur; g.beginPath();
            const n = Math.floor(drawn*N); for(let i=0;i<=n;i++){ const p = proj(P[i%N]); i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]); } g.stroke(); }
          g.shadowBlur = 0;
          // auto con le scie
          if(u > 0.25){
            const lapS = 2.6;   // secondi per giro
            for(const c of cars){ c.f += dt/lapS * vAt(c.f) * c.k * 1.25; c.tr.push(at(c.f)); if(c.tr.length > 26) c.tr.shift(); }
            for(const c of cars){
              for(let i=1;i<c.tr.length;i++){ const a=proj(c.tr[i-1]), b=proj(c.tr[i]); g.strokeStyle=c.col; g.globalAlpha=i/c.tr.length*0.8; g.lineWidth=5*b[2]; g.beginPath(); g.moveTo(a[0],a[1]); g.lineTo(b[0],b[1]); g.stroke(); }
              g.globalAlpha=1; const p = proj(c.tr[c.tr.length-1]); g.fillStyle=c.col; g.shadowColor=c.col; g.shadowBlur=18; g.beginPath(); g.arc(p[0],p[1],6*p[2],0,7); g.fill(); g.shadowBlur=0;
            }
          }
          g.setTransform(dpr,0,0,dpr,0,0);
        }
        // ----- logo -----
        if(t >= LOGO){
          const v = t - LOGO, k = v < 0.22 ? 2.6 - 1.6*(v/0.22) : 1;
          if(v < 0.05) shake = 26;
          g.fillStyle = `rgba(5,6,10,${Math.min(0.55, v*1.5)})`; g.fillRect(0,0,W,H);
          const fz = Math.min(120, W/8.5)*k; g.save(); g.translate(W/2, H/2 - fz*0.1); g.font = `italic 900 ${fz}px "Titillium Web","Segoe UI",sans-serif`; g.textBaseline='middle';
          const a = 'FREE', b = ' TO RACE', wa = g.measureText(a).width, wb = g.measureText(b).width, x = -(wa+wb)/2;
          g.globalAlpha = Math.min(1, v*6); g.shadowColor='#e10600'; g.shadowBlur=30; g.fillStyle='#e10600'; g.fillText(a, x, 0); g.shadowBlur=12; g.shadowColor='#000'; g.fillStyle='#fff'; g.fillText(b, x+wa, 0);
          g.restore();
          if(v > 0.5){ g.globalAlpha = Math.min(1,(v-0.5)*2); g.fillStyle='#c9cfdb'; g.font = `600 ${Math.max(15, Math.min(26, W/34))}px "Titillium Web","Segoe UI",sans-serif`; g.textAlign='center';
            g.fillText(L('Ogni auto. Ogni distacco. In diretta.','Every car. Every gap. Live.'), W/2, H/2 + Math.min(120,W/8.5)*0.75); g.textAlign='left'; g.globalAlpha=1; }
        }
        if(t >= END) return close();
        raf = requestAnimationFrame(frame);
      };
      raf = requestAnimationFrame(frame);
    }
  });
}



// ---------------- prossima sessione + programma del weekend + risultati (fuori dalla diretta) ----------------
// In cima: la prossima sessione col conto alla rovescia; poi il programma del weekend, dove le sessioni gia' corse
// hanno la spunta e aprono i loro risultati (sito/risultati, disegnati da risultati.js); sotto, i risultati scelti.
const RIS = {idx: [], cur: null, docs: {}, replays: new Set(), ok: false};
async function loadRis(){
  if(DEMO || !window.FTRRis) return;
  try{
    const [idx, rp] = await Promise.all([fetch('../risultati/index.json', {cache:'no-cache'}).then(r => r.json()),
                                         fetch('../replay/replays.json', {cache:'no-cache'}).then(r => r.json()).catch(() => [])]);
    RIS.idx = idx; RIS.replays = new Set(rp.map(x => x.name)); RIS.ok = true;
    if(!RIS.cur && idx.length) RIS.cur = idx[0].name;                  // l'ultima sessione pubblicata
    render(); drawRis();
  }catch(e){}
}
function risWeek(){                     // risultati del weekend in programma, o dell'ultimo weekend pubblicato
  if(!RIS.idx.length) return {same: false, items: []};
  const near = x => weekend && Math.abs(Date.parse(x.start) - weekend.sessions[0].d) < 5*86400e3;
  const same = RIS.idx.filter(near).sort((a, b) => (a.start || '').localeCompare(b.start || ''));
  if(same.length) return {same: true, items: same};
  const k = RIS.idx[0].year + RIS.idx[0].meeting;
  return {same: false, items: RIS.idx.filter(x => x.year + x.meeting === k).sort((a, b) => (a.start || '').localeCompare(b.start || ''))};
}
async function drawRis(){
  const box = $('#ris');
  if(DEMO || !RIS.ok){ box.innerHTML = ''; return; }
  const wk = risWeek(), byS = {}; for(const x of wk.items) byS[x.session] = x;
  const fmtD = d => new Date(d).toLocaleString(t('locale'), {weekday:'short', hour:'2-digit', minute:'2-digit'});
  let h = '';
  if(nextSess){
    h += `<div class="nx1"><div class="kick">${t('next')}</div><div class="nxl"><b>${esc(t('sess')[nextSess.s]||nextSess.s)}</b> · ${esc(new Date(nextSess.d).toLocaleString(t('locale'),{weekday:'long', day:'numeric', month:'long', hour:'2-digit', minute:'2-digit'}))}</div>
      <div class="where">${esc(nextSess.name)}${weekend && weekend.place ? ' · ' + esc(weekend.place) : ''}</div><div class="cdg tn" id="cdg">${cdHtml()}</div></div>`;
  }
  if(weekend){
    const now = Date.now();
    h += `<div class="rhd"><b>${t('weekend')}</b><a href="../risultati/${RIS.cur ? '?s=' + encodeURIComponent(RIS.cur) : ''}">${t('risAll')} →</a></div><div class="chips">` +
      weekend.sessions.map(x => { const r = wk.same ? byS[x.s] : null, isNext = nextSess && x.d === nextSess.d && x.s === nextSess.s;
        return `<button ${r ? `data-ris="${esc(r.name)}"` : 'disabled'} class="${isNext ? 'nx' : ''} ${!r && x.d < now ? 'past' : ''}">${r ? '✓ ' : ''}${esc(t('sess')[x.s]||x.s)}<small>${esc(fmtD(x.d))}</small></button>`; }).join('') + `</div>`;
  }
  if(wk.items.length && !wk.same){
    h += `<div class="rhd"><b>${t('lastWk')} · ${esc(wk.items[0].meeting)}</b></div><div class="chips">` +
      wk.items.map(x => `<button data-ris="${esc(x.name)}">${esc(t('sess')[x.session]||x.session)}</button>`).join('') + `</div>`;
  }
  const show = RIS.cur && wk.items.some(x => x.name === RIS.cur) ? RIS.cur : (wk.items.length ? wk.items[wk.items.length - 1].name : null);
  RIS.cur = show;
  box.innerHTML = h + `<div id="risBody"></div>`;
  if(!show) return;
  box.querySelectorAll('[data-ris]').forEach(b => b.classList.toggle('on', b.dataset.ris === show));
  try{
    const doc = RIS.docs[show] || (RIS.docs[show] = await (await fetch(`../risultati/${show}.json`, {cache:'no-cache'})).json());
    FTRRis.render($('#risBody'), doc, LANG, {sessName: t('sess')[doc.session] || doc.session, replay: RIS.replays.has(show) ? `?replay=${encodeURIComponent(show)}` : null});
  }catch(e){ $('#risBody').innerHTML = ''; }
}
$('#ris').addEventListener('click', e => { const b = e.target.closest('[data-ris]'); if(!b) return; RIS.cur = b.dataset.ris; drawRis(); });
loadRis();

// ---------------- avvisi per le bandiere, schermo acceso, classifica compatta ----------------
const opt = k => store.get('ftr.' + k, '1') === '1';
let prevFlag, flagTimer = 0;
function flagAlert(ts){
  if(ts == null){ prevFlag = undefined; return; }
  const was = prevFlag; prevFlag = ts;
  if(was === undefined || was === ts || !opt('vib')) return;
  const big = ['4', '5', '6'].includes(ts), clear = ts === '1' && ['4', '5', '6', '7'].includes(was);
  if(!big && !clear) return;
  const c = TRACKC[ts] || ['#1f9d55', '#fff'], b = $('#flagBan');
  b.textContent = String(t('track')[ts] || '').toUpperCase();
  b.style.background = c[0]; b.style.color = c[1]; b.classList.add('on');
  clearTimeout(flagTimer); flagTimer = setTimeout(() => b.classList.remove('on'), big ? 5000 : 3000);
  try{ if(navigator.vibrate) navigator.vibrate(big ? [250, 120, 250, 120, 250] : [150]); }catch(e){}
}
$('#flagBan').onclick = () => $('#flagBan').classList.remove('on');
let wl = null, wlBusy = false;
async function wakeLock(){
  const want = opt('wake') && !document.hidden && (DEMO ? !!(rp && !rp.paused) : isLive());
  if(wlBusy || !('wakeLock' in navigator) || want === !!wl) return;
  wlBusy = true;
  try{ if(want){ wl = await navigator.wakeLock.request('screen'); wl.addEventListener('release', () => { wl = null; }); } else { await wl.release(); wl = null; } }
  catch(e){ wl = null; }
  wlBusy = false;
}
document.addEventListener('visibilitychange', () => { wl = null; wakeLock(); });   // il sistema lo toglie quando l'app va in secondo piano
function applyOpts(){ document.body.classList.toggle('dense', opt('dense')); $$('[data-opt]').forEach(i => i.checked = opt(i.dataset.opt)); }
$$('[data-opt]').forEach(i => i.onchange = () => { store.set('ftr.' + i.dataset.opt, i.checked ? '1' : '0'); applyOpts(); wakeLock(); });
applyOpts();

// Chrome/Android: si tiene da parte l'invito del browser e lo si apre col pulsante, un tocco solo.
// iPhone: nessun sito puo' installare da se', si mostrano i tre passi di Safari. Nei browser interni
// (Instagram, Facebook) non si installa: si spiega come aprire il browser vero.
const UA = navigator.userAgent;
const STANDALONE = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
const IOS = /iPhone|iPad|iPod/i.test(UA) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const ANDROID = /Android/i.test(UA);
const INAPP = /Instagram|FBAN|FBAV|FB_IAB|Line\/|TikTok|musical_ly|; wv\)/i.test(UA);
const IOS_SAFARI = IOS && !/CriOS|FxiOS|EdgiOS|OPiOS/i.test(UA) && !INAPP;
let instEvt = null;
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); instEvt = e; if($('#instSheet').classList.contains('on')) instSheet(); });
window.addEventListener('appinstalled', () => { instEvt = null; instClose(); $('#instBar').classList.remove('on'); toast(t('instDone')); });
function instSheet(){
  let h = `<h3><img src="icon-192.png" alt="">${t('instH')}</h3><div class="dim" style="font-size:14px">${t('instOk')}</div>`;
  const steps = a => `<ol>${a.map(x=>`<li>${x}</li>`).join('')}</ol>`;
  if(instEvt) h += `<button class="btn main go" id="instGo">${t('instGo')}</button>`;
  else if(INAPP) h += `<p style="font-size:15px">${t('instInApp')}</p>`;
  else if(IOS) h += (IOS_SAFARI ? '' : `<p style="font-size:15px">${t('instIosOther')}</p>`) + steps(t('instIos'));
  else if(ANDROID) h += steps(t('instAnd'));
  else h += `<img class="qr" src="../img/qr_live.svg" alt="QR free-to-race.com/live"><p style="font-size:14px;text-align:center">${t('instPc')}</p>
    <p class="dim" style="font-size:13px;text-align:center">${t('instPcProg')} <a href="https://github.com/Nik88nk/freetorace/releases/latest/download/FreeToRace-Setup.exe" style="color:var(--text)">${t('pcDl')}</a></p>`;
  h += `<button class="close" id="instC">${t('instClose')}</button>`;
  $('#instBox').innerHTML = h;
  $('#instSheet').classList.add('on');
}
function instClose(){ $('#instSheet').classList.remove('on'); }
async function install(){
  if(!instEvt) return instSheet();
  const e = instEvt; instEvt = null;
  e.prompt(); try{ await e.userChoice; }catch(x){}
  instClose();
}
document.addEventListener('click', e => {
  if(e.target.closest('[data-install]') || e.target.closest('#instGo')){ e.preventDefault(); install(); }
  else if(e.target.closest('#instC') || e.target.id === 'instSheet') instClose();
  else if(e.target.closest('#instX')){ $('#instBar').classList.remove('on'); store.set('ftr.instX', Date.now()); }
});
const INSTALL_ASK = new URLSearchParams(location.search).has('install');   // arrivati dal pulsante del sito
if(STANDALONE) $('#instSet').style.display = 'none';
else if(INSTALL_ASK || Date.now() - (+store.get('ftr.instX', 0)) > 7*86400e3) $('#instBar').classList.add('on');   // chiusa: ricompare dopo una settimana

texts(); showDelay(); render();
if(DEMO){ startDemo(); $$('[data-d]').forEach(b => b.closest('.set').style.display='none'); }
else { loadNext(); connect();
  // prima apertura: l'intro, ma non se c'e' una sessione in diretta (chi apre al volo vuole i tempi)
  // ne' se si e' arrivati per installare: prima la finestra con il pulsante
  if(INSTALL_ASK && !STANDALONE) setTimeout(instSheet, 800);   // un attimo per l'invito di Chrome
  else setTimeout(() => { if(!isLive()) playIntro(false); }, 2500); }
</script>
</body>
</html>
