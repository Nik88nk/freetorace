<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F1 Predictions · Free to Race</title>
<link rel="icon" type="image/png" href="../img/logo.png">
<meta name="description" content="Pole, win and championship probabilities for the F1 weekend, updated after every session from practice pace. Unofficial fan project.">
<meta property="og:type" content="website">
<meta property="og:title" content="F1 weekend predictions — Free to Race">
<meta property="og:description" content="Pole, win and title probabilities, updated after every session.">
<meta property="og:url" content="https://free-to-race.com/predictions/">
<meta property="og:image" content="https://free-to-race.com/img/copertina.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0d12; --panel:#14181f; --panel2:#1b2029; --line:#262c37; --line2:#1d222b; --text:#eef1f6; --dim:#8b94a7; --dim2:#5d6577;
  --accent:#e10600; --purple:#b46cff; --green:#22d36b; --yellow:#ffd12e;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 "Titillium Web","Segoe UI",system-ui,sans-serif}
a{color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:0 16px}
.tn{font-variant-numeric:tabular-nums}
.dim{color:var(--dim)}
nav{position:sticky;top:0;z-index:10;background:rgba(8,9,13,.92);backdrop-filter:blur(8px);border-bottom:3px solid var(--accent)}
nav .wrap{display:flex;align-items:center;gap:18px;height:60px}
.brand{font-weight:900;font-size:21px;font-style:italic;letter-spacing:.3px;text-decoration:none;display:flex;align-items:center;gap:9px}
.brand b{color:var(--accent)}
.brand img{width:32px;height:32px}
.links{display:flex;gap:18px;font-weight:600;font-size:15px;margin-left:auto}
.links a{text-decoration:none;color:var(--dim)}
.links a:hover,.links a.on{color:var(--text)}
.lang{background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:8px;padding:6px 10px;font:inherit;font-weight:700;cursor:pointer}
.btn{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:10px;font-weight:700;text-decoration:none;border:1px solid var(--line);background:var(--panel2)}
.btn.main{background:var(--accent);border-color:var(--accent);color:#fff}
@media(max-width:760px){.links,.btn.main{display:none}.lang{margin-left:auto}}
header{padding:44px 0 26px;background:radial-gradient(ellipse at 70% 0%,rgba(225,6,0,.18),transparent 60%)}
.kick{font-size:12px;letter-spacing:1.4px;text-transform:uppercase;color:var(--accent);font-weight:900}
h1{font-size:clamp(32px,5vw,56px);line-height:1.02;margin:6px 0 10px;font-weight:900;font-style:italic}
.meta{color:var(--dim)}
.steps{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
.steps span{font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px;border:1px solid var(--line);color:var(--dim2)}
.steps span.done{color:var(--text);border-color:#3a4150;background:var(--panel2)}
.steps span.now{color:#fff;border-color:var(--accent);background:var(--accent)}
section{padding:30px 0;border-top:1px solid var(--line2)}
h2{font-size:clamp(24px,3vw,32px);margin:0 0 4px;font-weight:900}
p.sub{color:var(--dim);margin:0 0 18px}
.fav{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;border-top:4px solid var(--c,#444)}
.card .k{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim);font-weight:700}
.card .who{font-size:26px;font-weight:900;line-height:1.1;margin-top:6px}
.card .who small{display:block;font-size:14px;color:var(--dim);font-weight:600}
.card .pc{font-size:44px;font-weight:900;line-height:1;margin-top:8px;font-variant-numeric:tabular-nums}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.panel h3{margin:0;padding:12px 16px;font-size:12px;letter-spacing:1.3px;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--line)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{padding:8px 12px;border-bottom:1px solid var(--line2);text-align:left;white-space:nowrap}
th{font-size:11px;color:var(--dim);letter-spacing:1px;text-transform:uppercase;font-weight:700}
td.num,th.num{text-align:right}
.bar{width:4px;padding:0!important}
.bar i{display:block;width:4px;height:24px;border-radius:2px}
.drv b{font-size:16px}
.drv small{color:var(--dim);margin-left:6px}
.pbar{display:flex;align-items:center;gap:8px;min-width:150px}
.pbar .t{flex:1;height:8px;background:#0f1217;border-radius:4px;overflow:hidden;min-width:70px}
.pbar .t i{display:block;height:8px;border-radius:4px}
.pbar span{width:46px;text-align:right;font-weight:700}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:900px){.two{grid-template-columns:1fr}}
.pace{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.prow{display:flex;align-items:center;gap:8px;padding:5px 14px;font-size:14px;border-bottom:1px solid var(--line2)}
.prow .n{width:40px;font-weight:700}
.prow .t{flex:1;height:7px;background:#0f1217;border-radius:4px;overflow:hidden}
.prow .t i{display:block;height:7px;border-radius:4px}
.prow .v{width:64px;text-align:right;color:var(--dim)}
.how{color:#c3c9d6;max-width:860px}
.how li{margin:4px 0}
.bt{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:14px}
.bt div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.bt b{display:block;font-size:24px}
.bt span{color:var(--dim);font-size:13px}
.empty{color:var(--dim);padding:16px}
footer{padding:34px 0 56px;border-top:1px solid var(--line2);color:var(--dim);font-size:13px}
footer p{margin:6px 0;max-width:900px}
</style>
</head>
<body>
<nav><div class="wrap">
  <a class="brand" href="../"><img src="../img/logo.png" alt=""><span><b>FREE</b> TO RACE</span></a>
  <div class="links"><a href="../" data-i="nav_home"></a><a href="./" class="on" data-i="nav_pred"></a><a href="../demo/" data-i="nav_demo"></a></div>
  <button class="lang" id="lang" title="English / Italiano"></button>
  <a class="btn main" href="https://github.com/Nik88nk/freetorace/releases/latest/download/FreeToRace-win64.zip" data-i="dl"></a>
</div></nav>

<header><div class="wrap">
  <div class="kick" data-i="kick"></div>
  <h1 id="title">…</h1>
  <div class="meta" id="meta"></div>
  <div class="steps" id="steps"></div>
</div></header>

<main class="wrap">
  <section style="border-top:none;padding-top:10px">
    <div class="fav" id="fav"></div>
  </section>
  <section>
    <h2 data-i="h_prob"></h2><p class="sub" data-i="s_prob"></p>
    <div class="panel"><div class="scroll"><table id="prob"></table></div></div>
  </section>
  <section id="paceSec">
    <h2 data-i="h_pace"></h2><p class="sub" data-i="s_pace"></p>
    <div class="pace" id="pace"></div>
  </section>
  <section>
    <h2 data-i="h_champ"></h2><p class="sub" id="champSub"></p>
    <div class="two">
      <div class="panel"><h3 data-i="drivers"></h3><div id="cd"></div></div>
      <div class="panel"><h3 data-i="constructors"></h3><div id="cc"></div></div>
    </div>
  </section>
  <section>
    <h2 data-i="h_how"></h2>
    <ul class="how" id="how"></ul>
    <div class="bt" id="bt"></div>
  </section>
</main>

<footer><div class="wrap">
  <p data-i="disc"></p>
  <p data-i="credits"></p>
</div></footer>

<script>
const T = {
 en:{nav_home:'Home', nav_pred:'Predictions', nav_demo:'Demo', dl:'⬇ Download', kick:'Weekend predictions',
  updated:'Updated', round:'Round', h_prob:'Pole and win', s_prob:'Probabilities from 20,000 simulations of qualifying and race.',
  driver:'Driver', pole:'Pole', win:'Win', podium:'Podium', points:'Points finish', xpts:'Exp. points',
  fav_pole:'Pole favourite', fav_win:'Win favourite', fav_title:'Title favourite',
  h_pace:'Practice pace', s_pace:'Gap to the fastest, in %. One lap = best single lap; long run = average of long stints on the same compound.',
  one:'one lap', long:'long run', h_champ:'Championship', drivers:'Drivers', constructors:'Constructors',
  champ_sub:(n)=>`Chance of winning the title, simulating the ${n} race weekends still to go (sprints included).`,
  now:'pts now', h_how:'How it works',
  how:['A season baseline: how fast each driver and team has been in qualifying and in races lately, recent weekends weighing more.',
       'Practice: best single laps and long runs, compared with the rest of the field. The more sessions are done, the more they count.',
       'The weights are learned on every weekend of 2025 and 2026 already run, leaving out the one being predicted.',
       'Then qualifying and the race are simulated 20,000 times: pace with its typical error, grid position, race incidents and retirements.'],
  bt_h:'Tested on past weekends', bt_win:'winner right (after quali)', bt_pole:'pole right (after the last practice)', bt_rule:(v)=>`simple rule: ${v}`,
  disc:'For fun only, not betting advice. <b style="color:var(--text)">Free to Race</b> is a free, <b>unofficial</b> fan project and is not associated in any way with the Formula 1 companies. F1, FORMULA ONE, FORMULA 1, GRAND PRIX and related marks are trade marks of Formula One Licensing B.V.',
  credits:'Data: public F1 timing archive and <a href="https://github.com/jolpica/jolpica-f1">Jolpica-F1</a>. Support the project: <a href="https://ko-fi.com/freetorace">ko-fi.com/freetorace</a>.',
  state:{pre:'before the weekend', FP1:'after FP1', FP2:'after FP2', FP3:'after FP3', SQ:'after Sprint Qualifying', S:'after the Sprint', Q:'after Qualifying'},
  nodata:'No data yet.', locale:'en-GB'},
 it:{nav_home:'Home', nav_pred:'Previsioni', nav_demo:'Demo', dl:'⬇ Scarica', kick:'Previsioni del weekend',
  updated:'Aggiornato', round:'Round', h_prob:'Pole e vittoria', s_prob:'Probabilità da 20.000 simulazioni di qualifica e gara.',
  driver:'Pilota', pole:'Pole', win:'Vittoria', podium:'Podio', points:'A punti', xpts:'Punti attesi',
  fav_pole:'Favorito per la pole', fav_win:'Favorito per la vittoria', fav_title:'Favorito per il titolo',
  h_pace:'Passo nelle libere', s_pace:'Distacco dal più veloce, in %. Giro secco = miglior giro; passo gara = media degli stint lunghi sulla stessa mescola.',
  one:'giro secco', long:'passo gara', h_champ:'Campionato', drivers:'Piloti', constructors:'Costruttori',
  champ_sub:(n)=>`Probabilità di vincere il titolo, simulando i ${n} weekend che mancano (sprint comprese).`,
  now:'punti ora', h_how:'Come funziona',
  how:['Una base della stagione: quanto sono stati veloci di recente piloti e squadre in qualifica e in gara; i weekend recenti pesano di più.',
       'Le libere: giro secco e stint lunghi, confrontati con il resto del gruppo. Più sessioni sono finite, più contano.',
       'I pesi sono imparati su tutti i weekend del 2025 e 2026 già corsi, lasciando fuori quello da prevedere.',
       'Poi qualifica e gara si simulano 20.000 volte: passo con il suo errore tipico, posizione in griglia, imprevisti e ritiri.'],
  bt_h:'Provato sui weekend passati', bt_win:'vincitore indovinato (dopo la qualifica)', bt_pole:'pole indovinata (dopo l’ultima sessione di libere)', bt_rule:(v)=>`regola semplice: ${v}`,
  disc:'Solo per divertimento, non è un consiglio per scommettere. <b style="color:var(--text)">Free to Race</b> è un progetto di appassionati, gratuito e <b>non ufficiale</b>: non è associato in alcun modo alle società di Formula 1. F1, FORMULA ONE, FORMULA 1, GRAND PRIX e i marchi collegati appartengono a Formula One Licensing B.V.',
  credits:'Dati: archivio pubblico dei tempi F1 e <a href="https://github.com/jolpica/jolpica-f1">Jolpica-F1</a>. Sostieni il progetto: <a href="https://ko-fi.com/freetorace">ko-fi.com/freetorace</a>.',
  state:{pre:'prima del weekend', FP1:'dopo le FP1', FP2:'dopo le FP2', FP3:'dopo le FP3', SQ:'dopo la Sprint Qualifying', S:'dopo la Sprint', Q:'dopo la qualifica'},
  nodata:'Ancora nessun dato.', locale:'it-IT'}
};
let LANG = (()=>{ try{ const s=localStorage.getItem('ftr.lang'); if(s==='it'||s==='en') return s; }catch(e){} return 'en'; })();
const t = k => T[LANG][k];
const $ = id => document.getElementById(id);
const esc = s => String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct = (v, d) => v==null ? '—' : v<0.001 ? '<0.1%' : v>0.999 ? '>99.9%' : (v*100).toFixed(d ?? (v<0.1?1:0))+'%';
const SESS = {FP1:'FP1', FP2:'FP2', FP3:'FP3', SQ:'Sprint Q', S:'Sprint', Q:'Quali'};
let D = null;

function pbar(v, color){ return `<div class="pbar"><div class="t"><i style="width:${Math.max(1, v*100)}%;background:${color}"></i></div><span>${pct(v)}</span></div>`; }

function render(){
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i]').forEach(e => { const v=t(e.dataset.i); if(typeof v==='string') e.innerHTML = v; });
  $('lang').textContent = LANG==='it' ? 'EN' : 'IT';
  if(!D) return;
  const ev = D.event, drv = D.drivers;
  $('title').textContent = `${ev.name} ${ev.year}`;
  $('meta').textContent = `${t('round')} ${ev.round??''} · ${t('state')[ev.state]} · ${t('updated')} ${new Date(D.generated).toLocaleString(t('locale'), {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'})}`;
  $('steps').innerHTML = ev.sessions.map(k => `<span class="${k===ev.state?'now':ev.done.includes(k)?'done':''}">${SESS[k]||k}</span>`).join('') + `<span class="${ev.done.includes('R')?'done':''}">${LANG==='it'?'Gara':'Race'}</span>`;
  const top = (k) => drv.slice().sort((a,b)=>(b[k]||0)-(a[k]||0))[0];
  const tp = top('pole'), tw = top('win');
  const ch = Object.entries(D.championship.drivers).sort((a,b)=>b[1].title-a[1].title)[0];
  const chd = drv.find(d=>d.tla===ch[0]) || {tla:ch[0], name:ch[0], color:'#888'};
  const card = (k, d, v) => `<div class="card" style="--c:${d.color}"><div class="k">${t(k)}</div><div class="who">${esc(d.name)}<small>${esc(d.team||'')}</small></div><div class="pc" style="color:${d.color}">${pct(v,0)}</div></div>`;
  $('fav').innerHTML = (ev.state!=='Q' ? card('fav_pole', tp, tp.pole) : '') + card('fav_win', tw, tw.win) + card('fav_title', chd, ch[1].title);
  $('prob').innerHTML = `<thead><tr><th></th><th>${t('driver')}</th>${ev.state!=='Q'?`<th>${t('pole')}</th>`:''}<th>${t('win')}</th><th>${t('podium')}</th><th class="num">${t('points')}</th><th class="num">${t('xpts')}</th></tr></thead><tbody>` +
    drv.map(d => `<tr><td class="bar"><i style="background:${d.color}"></i></td><td class="drv"><b>${esc(d.tla)}</b><small>${esc(d.team||'')}</small></td>${ev.state!=='Q'?`<td>${pbar(d.pole, d.color)}</td>`:''}<td>${pbar(d.win, d.color)}</td><td>${pbar(d.podium, d.color)}</td><td class="num">${pct(d.points,0)}</td><td class="num">${d.xpts.toFixed(1)}</td></tr>`).join('') + '</tbody>';
  // passo delle libere
  const col = Object.fromEntries(drv.map(d=>[d.tla, d.color]));
  const blocks = [];
  for(const [k, s] of Object.entries(D.sessions)){
    for(const [kind, lbl] of [['short','one'],['long','long']]){
      const e = Object.entries(s[kind]||{}).sort((a,b)=>a[1]-b[1]);
      if(e.length < 3) continue;
      const mx = Math.max(...e.map(x=>x[1]), 0.5);
      blocks.push(`<div class="panel"><h3>${SESS[k]||k} · ${t(lbl)}</h3>${e.map(([tla,g])=>`<div class="prow"><span class="n">${esc(tla)}</span><div class="t"><i style="width:${Math.max(2,100-g/mx*80)}%;background:${col[tla]||'#888'}"></i></div><span class="v">${g<0.0005?'—':'+'+g.toFixed(2)+'%'}</span></div>`).join('')}</div>`);
    }
  }
  $('pace').innerHTML = blocks.join('') || `<div class="empty">${t('nodata')}</div>`;
  $('paceSec').style.display = blocks.length ? '' : 'none';
  // campionato
  $('champSub').textContent = t('champ_sub')(D.championship.races_left);
  const crow = (name, color, v) => `<div class="prow" style="padding:8px 14px"><span class="n" style="width:auto;min-width:120px">${esc(name)}</span><div class="t"><i style="width:${Math.max(1,v.title*100)}%;background:${color}"></i></div><span class="v" style="width:120px"><b style="color:var(--text)">${pct(v.title)}</b> · ${Math.round(v.now)} ${t('now')}</span></div>`;
  const cdr = Object.entries(D.championship.drivers).filter(([,v])=>v.title>0.0005 || v.now>0).sort((a,b)=>b[1].title-a[1].title || b[1].now-a[1].now).slice(0,8);
  $('cd').innerHTML = cdr.map(([tla,v]) => { const d=drv.find(x=>x.tla===tla); return crow(d?d.name:tla, d?d.color:'#888', v); }).join('');
  const tcol = {}; drv.forEach(d=>{ if(d.team) tcol[d.team]=d.color; });
  const cname = n => n.replace(/ F1 Team$/,'').replace(/^RB$/,'Racing Bulls');
  const ccr = Object.entries(D.championship.constructors).sort((a,b)=>b[1].title-a[1].title || b[1].now-a[1].now).slice(0,6);
  $('cc').innerHTML = ccr.map(([tm,v]) => { const c = Object.entries(tcol).find(([k])=>k.toLowerCase().includes(tm.toLowerCase().split(' ')[0]))?.[1] || '#888'; return crow(cname(tm), c, v); }).join('');
  // come funziona e prova sul passato
  $('how').innerHTML = t('how').map(x=>`<li>${x}</li>`).join('');
  const b = D.backtest && D.backtest.summary;
  if(b){
    const q = b.Q, last = b.FP3 || b.S;
    $('bt').innerHTML = `<div style="grid-column:1/-1;background:none;border:none;padding:0"><b style="font-size:18px">${t('bt_h')}</b></div>` +
      (q ? `<div><b>${pct(q.win_top,0)}</b><span>${t('bt_win')} · ${t('bt_rule')(pct(q.base_win_top,0))}</span></div>` : '') +
      (last ? `<div><b>${pct(last.pole_top,0)}</b><span>${t('bt_pole')} · ${t('bt_rule')(pct(last.base_pole_top,0))}</span></div>` : '');
  }
}
$('lang').onclick = () => { LANG = LANG==='it' ? 'en' : 'it'; try{ localStorage.setItem('ftr.lang', LANG); }catch(e){} render(); };
render();
fetch('data.json?'+Date.now()).then(r=>r.json()).then(j=>{ D=j; render(); }).catch(()=>{ $('title').textContent = t('nodata'); });
</script>
</body>
</html>
