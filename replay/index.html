<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>F1 race replays in your browser · Free to Race</title>
<link rel="canonical" href="https://free-to-race.com/replay/">
<link rel="icon" type="image/png" sizes="96x96" href="../img/favicon-96.png">
<link rel="icon" type="image/png" sizes="48x48" href="../img/favicon-48.png">
<meta name="description" content="Replays of the sessions recorded live by Free to Race: timing, tyres, strategy and the track map, in your browser. Unofficial fan project.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d12;--panel:#14181f;--panel2:#1b2029;--line:#262c37;--line2:#1d222b;--text:#eef1f6;--dim:#8b94a7;--accent:#e10600}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 "Titillium Web","Segoe UI",system-ui,sans-serif}
a{color:inherit}
.wrap{max-width:900px;margin:0 auto;padding:0 16px}
nav{border-bottom:3px solid var(--accent);background:#08090d}
nav .wrap{display:flex;align-items:center;gap:14px;height:58px}
.brand{font-weight:900;font-size:20px;font-style:italic;text-decoration:none;display:flex;align-items:center;gap:9px}
.brand b{color:var(--accent)}
.lang{margin-left:auto;background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:8px;padding:6px 10px;font:inherit;font-weight:700;cursor:pointer}
h1{font-size:clamp(30px,5vw,44px);font-weight:900;margin:34px 0 6px;line-height:1.1}
.sub{color:var(--dim);margin:0 0 24px}
.list{display:grid;gap:10px;margin-bottom:40px}
.it{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:12px;padding:14px 16px;text-decoration:none}
.it:hover{background:var(--panel2)}
.it div{flex:1;min-width:0}
.it b{display:block;font-size:18px;line-height:1.2}
.it small{color:var(--dim)}
.it span.go{font-weight:900;color:var(--accent);white-space:nowrap}
.empty{color:var(--dim);padding:20px 0}
footer{color:var(--dim);font-size:13px;padding:20px 0 40px;border-top:1px solid var(--line2)}
</style>
<script data-goatcounter="https://freetorace.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</head>
<body>
<nav><div class="wrap">
  <a class="brand" href="../"><img src="../img/logo.png" alt="" style="width:30px;height:30px"><span><b>FREE</b> TO RACE</span></a>
  <a href="../risultati/" style="margin-left:auto;text-decoration:none;color:var(--ink2,#b6bdca);font-weight:600;white-space:nowrap" data-i="ris"></a>
  <button class="lang" id="lang" style="margin-left:0"></button>
</div></nav>
<main class="wrap">
  <h1 data-i="h"></h1>
  <p class="sub" data-i="sub"></p>
  <div class="list" id="list"><div class="empty" data-i="loading"></div></div>
</main>
<footer><div class="wrap" data-i="disc"></div></footer>
<script>
const T = {
 en:{h:'🎬 Replays', ris:'📊 Results', sub:'The sessions recorded live, ready to watch again: timing, tyres, strategy and the track map, running in your browser.', loading:'Loading…', none:'No replays yet.', err:'The list could not load. Try again later.', watch:'▶ Watch', laps:'laps',
  sess:{'Practice 1':'Practice 1','Practice 2':'Practice 2','Practice 3':'Practice 3','Sprint Qualifying':'Sprint Qualifying','Sprint':'Sprint','Qualifying':'Qualifying','Race':'Race'},
  disc:'Free to Race is an unofficial fan project, not associated in any way with the Formula 1 companies. F1, FORMULA ONE, FORMULA 1, GRAND PRIX and related marks are trade marks of Formula One Licensing B.V.', locale:'en-GB'},
 it:{h:'🎬 Replay', ris:'📊 Risultati', sub:'Le sessioni registrate in diretta, da rivedere: tempi, gomme, strategia e la pista, nel tuo browser.', loading:'Carico…', none:'Ancora nessun replay.', err:'Non riesco a caricare l’elenco. Riprova più tardi.', watch:'▶ Guarda', laps:'giri',
  sess:{'Practice 1':'Libere 1','Practice 2':'Libere 2','Practice 3':'Libere 3','Sprint Qualifying':'Qualifica Sprint','Sprint':'Sprint','Qualifying':'Qualifica','Race':'Gara'},
  disc:'Free to Race è un progetto di appassionati non ufficiale, non associato in alcun modo alle società di Formula 1. F1, FORMULA ONE, FORMULA 1, GRAND PRIX e i marchi collegati appartengono a Formula One Licensing B.V.', locale:'it-IT'}};
let LANG = (()=>{ try{ const s=localStorage.getItem('ftr.lang'); if(s==='it'||s==='en') return s; }catch(e){} return /^it\b/i.test(navigator.language||'')?'it':'en'; })();
const t = k => T[LANG][k];
const esc = s => String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const MOBILE = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
let items = null, failed = false;
function render(){
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i]').forEach(e => { const v = t(e.dataset.i); if(typeof v === 'string') e.innerHTML = v; });
  document.getElementById('lang').textContent = LANG==='it' ? 'EN' : 'IT';
  const box = document.getElementById('list');
  if(failed){ box.innerHTML = `<div class="empty">${t('err')}</div>`; return; }
  if(!items){ box.innerHTML = `<div class="empty">${t('loading')}</div>`; return; }
  if(!items.length){ box.innerHTML = `<div class="empty">${t('none')}</div>`; return; }
  box.innerHTML = items.map(x => {
    const when = x.start ? new Date(x.start).toLocaleDateString(t('locale'), {weekday:'long', day:'numeric', month:'long', year:'numeric'}) : '';
    const href = MOBILE ? `../live/?replay=${encodeURIComponent(x.name)}` : `${encodeURIComponent(x.name)}/`;
    return `<a class="it" href="${href}"><div><b>${esc(x.meeting)} ${esc(x.year)} · ${esc(t('sess')[x.session]||x.session)}</b><small>${esc(when)}${x.laps?` · ${x.laps} ${t('laps')}`:''}</small></div><span class="go">${t('watch')}</span></a>`;
  }).join('');
}
document.getElementById('lang').onclick = () => { LANG = LANG==='it' ? 'en' : 'it'; try{ localStorage.setItem('ftr.lang', LANG); }catch(e){} render(); };
render();
fetch('replays.json', {cache:'no-cache'}).then(r => { if(!r.ok) throw new Error(r.status); return r.json(); })
  .then(j => { items = j; render(); }).catch(() => { failed = true; render(); });
</script>
</body>
</html>
