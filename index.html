<style>
:root{
  --bg:#0b0d12; --panel:#14181f; --panel2:#1b2029; --line:#262c37; --line2:#1d222b; --text:#eef1f6; --dim:#8b94a7; --dim2:#5d6577;
  --accent:#e10600; --purple:#b46cff; --green:#22d36b; --yellow:#ffd12e;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 "Titillium Web","Segoe UI",system-ui,sans-serif}
a{color:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:0 20px}
.tn{font-variant-numeric:tabular-nums}
.dim{color:var(--dim)}

/* barra */
nav{position:sticky;top:0;z-index:10;background:rgba(8,9,13,.92);backdrop-filter:blur(8px);border-bottom:3px solid var(--accent)}
nav .wrap{display:flex;align-items:center;gap:22px;height:60px}
.brand{font-weight:900;font-size:21px;font-style:italic;letter-spacing:.3px;text-decoration:none}
.brand b{color:var(--accent)}
nav .links{display:flex;gap:18px;margin-left:auto;font-weight:600;font-size:15px}
nav .links a{text-decoration:none;color:var(--dim)}
nav .links a:hover{color:var(--text)}
@media(max-width:760px){nav .links{display:none}}
.btn{display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:10px;font-weight:700;text-decoration:none;border:1px solid var(--line);background:var(--panel2)}
.btn.main{background:var(--accent);border-color:var(--accent);color:#fff}
.btn:hover{filter:brightness(1.1)}

/* apertura */
.hero{padding:70px 0 40px;background:radial-gradient(ellipse at 70% 0%,rgba(225,6,0,.18),transparent 60%)}
.hero .wrap{display:grid;grid-template-columns:1fr 1.15fr;gap:40px;align-items:center}
@media(max-width:960px){.hero .wrap{grid-template-columns:1fr}}
.hero h1{font-size:clamp(38px,5.5vw,64px);line-height:1;margin:0 0 16px;font-weight:900;font-style:italic;letter-spacing:-.5px}
.hero h1 b{color:var(--accent)}
.hero p.lead{font-size:20px;color:#c9cfdb;margin:0 0 26px;max-width:520px}
.hero .cta{display:flex;gap:12px;flex-wrap:wrap}
.hero .small{font-size:13px;color:var(--dim);margin-top:12px}
.shot{border-radius:12px;border:1px solid var(--line);box-shadow:0 30px 80px rgba(0,0,0,.6);width:100%;display:block}

section{padding:56px 0;border-top:1px solid var(--line2)}
h2{font-size:clamp(28px,3.5vw,38px);margin:0 0 8px;font-weight:900}
h2 + p.sub{color:var(--dim);margin:0 0 28px}

/* funzioni */
.feats{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.feat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.feat h3{margin:0 0 6px;font-size:19px}
.feat p{margin:0;color:#c3c9d6;font-size:15px}
.feat .tag{display:inline-block;font-size:11px;font-weight:900;letter-spacing:1px;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.gallery{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:22px}
@media(max-width:860px){.gallery{grid-template-columns:1fr}}
.gallery figure{margin:0}
.gallery figcaption{color:var(--dim);font-size:14px;margin-top:6px}

/* mappa */
.next{display:flex;align-items:center;gap:20px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:12px;padding:16px 20px;margin-bottom:18px}
.next .k{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim);font-weight:700}
.next .v{font-size:24px;font-weight:900;line-height:1.1}
.cd{display:flex;gap:10px;margin-left:auto}
.cd div{text-align:center;background:var(--panel2);border-radius:8px;padding:6px 10px;min-width:62px}
.cd b{display:block;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.cd span{font-size:10px;color:var(--dim);letter-spacing:1px;text-transform:uppercase}
.mapbox{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
#map{display:block;width:100%;height:auto}
.tip{position:absolute;pointer-events:none;background:rgba(10,12,16,.96);border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-size:13px;display:none;max-width:260px;z-index:3}
.tip b{display:block;font-size:14px}
.legend{display:flex;gap:18px;flex-wrap:wrap;color:var(--dim);font-size:13px;padding:10px 16px;border-top:1px solid var(--line2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.cal{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px;margin-top:16px}
.race{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid var(--line2);border-radius:8px;padding:8px 12px;font-size:14px}
.race .r{font-weight:900;color:var(--dim);width:28px}
.race .n{flex:1;line-height:1.2}
.race .n small{display:block;color:var(--dim)}
.race .w{text-align:right;font-weight:700;line-height:1.2}
.race .w small{display:block;color:var(--dim);font-weight:400}
.race.nextr{border-color:var(--accent)}
.race.done{opacity:.85}

/* classifiche */
.two{display:grid;grid-template-columns:1.15fr 1fr;gap:18px}
@media(max-width:900px){.two{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.panel h3{margin:0;padding:12px 16px;font-size:12px;letter-spacing:1.3px;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--line)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td,th{padding:7px 12px;border-bottom:1px solid var(--line2);text-align:left}
th{font-size:11px;color:var(--dim);letter-spacing:1px;text-transform:uppercase;font-weight:700}
td.num,th.num{text-align:right}
td.p{font-weight:900;width:34px;text-align:right}
.bar{width:4px;padding:0!important}
.bar i{display:block;width:4px;height:22px;border-radius:2px}
.pts{font-weight:900}
.cbar{display:flex;align-items:center;gap:10px}
.cbar .t{flex:1;height:10px;background:#0f1217;border-radius:5px;overflow:hidden}
.cbar .t i{display:block;height:10px;border-radius:5px}

/* squadre */
.teams{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.team{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.team .top{padding:14px 16px 10px;border-top:5px solid}
.team .top .nm{font-size:20px;font-weight:900;line-height:1.1}
.team .top .meta{color:var(--dim);font-size:13px}
.drv{display:flex;align-items:center;gap:12px;padding:9px 16px;border-top:1px solid var(--line2)}
.drv .no{font-size:24px;font-weight:900;width:38px;text-align:center;line-height:1}
.drv .who{flex:1;line-height:1.2}
.drv .who small{display:block;color:var(--dim)}
.drv .pt{text-align:right;font-weight:700;line-height:1.2}
.drv .pt small{display:block;color:var(--dim);font-weight:400}

footer{padding:40px 0 60px;border-top:1px solid var(--line2);color:var(--dim);font-size:13px}
footer p{margin:6px 0;max-width:900px}
.err{color:var(--dim);padding:20px;text-align:center}
.lang{background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:8px;padding:6px 10px;font:inherit;font-weight:700;cursor:pointer;margin-left:auto}
nav .links{margin-left:0!important}
nav .links + .lang{margin-left:auto}
#qrPop{position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:20px}
#qrPop.on{display:flex}
#qrPop .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px 26px;max-width:340px;text-align:center}
#qrPop h3{margin:0 0 6px;font-size:21px}
#qrPop img.qr{display:block;width:200px;height:200px;margin:14px auto;border-radius:10px}
#qrPop p{margin:6px 0;color:#c3c9d6;font-size:15px}
#qrPop button{margin-top:10px;background:none;border:none;color:var(--dim);font:inherit;cursor:pointer}
.btn.kofi{background:#29abe0;border-color:#29abe0;color:#fff}
.btn.kofi.big{padding:14px 24px;font-size:17px}
.smart{margin-top:14px;color:var(--dim);font-size:14px;max-width:520px}
.smart summary{cursor:pointer}
.support{display:flex;align-items:center;gap:24px;flex-wrap:wrap;margin-top:28px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px 24px}
.support div{flex:1;min-width:260px}
.support h3{margin:0 0 4px}
.support p{margin:0;color:#c3c9d6}
@media(max-width:760px){.btn.kofi:not(.big){display:none}}
</style>
</head>

<nav><div class="wrap">
  <a class="brand" href="#" style="display:flex;align-items:center;gap:9px"><img src="img/logo.png" alt="" style="width:32px;height:32px"><span><b>FREE</b> TO RACE</span></a>
  <div class="links"><a href="#features" data-i="nav_app"></a><a href="#season-sec" data-i="nav_cal"></a><a href="#standings" data-i="nav_st"></a><a href="#teams-sec" data-i="nav_teams"></a><a href="live/" data-i="nav_live" style="color:var(--text)"></a><a href="replay/" data-i="nav_rp"></a><a href="#feedback" data-i="nav_fb"></a><!-- pagina previsioni pronta, da riattivare al lancio: <a href="predictions/" data-i="nav_pred" style="color:var(--text)"></a> --></div>

</div></section>

<section id="season-sec"><div class="wrap">

</div></section>

</div></section>

  locale:'it-IT'
 }
};
// inglese di default; l'italiano solo se scelto con il pulsante (e allora si ricorda)
let LANG = (()=>{ try{ const s=localStorage.getItem('ftr.lang'); if(s==='it'||s==='en') return s; }catch(e){} return 'en'; })();
const t = k => T[LANG][k];
function applyLang(){
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i]').forEach(e => { const v=t(e.dataset.i); if(typeof v==='string') e.innerHTML = v; });
  $('lang').textContent = LANG==='it' ? 'EN' : 'IT';
  if(races.length){ renderNext(); renderCal(); }
  if(lastStandings) renderStandings(...lastStandings);
  if(!lastStandings){ $('drivers').innerHTML = `<tr><td colspan="6" class="err">${t('loading')}</td></tr>`; }
}

// ---------------- dati ----------------
const API = 'https://api.jolpi.ca/ergast/f1/current';
const TEAM_COLORS = {mercedes:'#00D7B6', ferrari:'#ED1131', mclaren:'#F47600', red_bull:'#4781D7', rb:'#6C98FF', alpine:'#00A1E8',
  haas:'#9C9FA2', audi:'#F50537', sauber:'#F50537', williams:'#1868DB', aston_martin:'#229971', cadillac:'#909090'};
const TEAM_NAMES = {red_bull:'Red Bull Racing', rb:'Racing Bulls', alpine:'Alpine', cadillac:'Cadillac', haas:'Haas', mercedes:'Mercedes',
  ferrari:'Ferrari', mclaren:'McLaren', williams:'Williams', aston_martin:'Aston Martin', audi:'Audi'};
const col = id => TEAM_COLORS[id] || '#888';
const tname = c => TEAM_NAMES[c.constructorId] || c.name;
const esc = s => String(s??'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const raceTime = r => new Date(r.date + 'T' + (r.time || '12:00:00Z'));
const fmtDate = d => d.toLocaleDateString(t('locale'), {day:'numeric', month:'short'});
const $ = id => document.getElementById(id);
async function j(path){ const r = await fetch(API + path); if(!r.ok) throw new Error(r.status); return (await r.json()).MRData; }

let races=[], winners={}, lastStandings=null, cdTimer=null;
// Dal telefono il pulsante principale installa l'app (il programma per Windows li' non serve);
// dal PC «Live sul telefono» mostra il QR da inquadrare.
const MOBILE = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
if(MOBILE){
  $('dlMain').href = $('dlNav').href = 'live/?install=1';
  $('dlMain').dataset.i = 'ph_install'; $('dlNav').dataset.i = 'ph_short';
  $('liveBtn').style.display = 'none';   // fa gia' il pulsante principale
} else {
  $('liveBtn').onclick = e => { e.preventDefault(); $('qrPop').classList.add('on'); };
  $('qrPop').onclick = e => { if(e.target.id === 'qrPop' || e.target.id === 'qrClose') $('qrPop').classList.remove('on'); };
}
async function main(){
  applyLang();
  try{
    const [rt, res] = await Promise.all([j('.json?limit=40'), j('/results/1.json?limit=100')]);
    races = rt.RaceTable.Races;
    $('season').textContent = rt.RaceTable.season;
    for(const r of res.RaceTable.Races) winners[r.round] = r.Results[0];
    renderNext(); renderCal(); await renderMap();
  }catch(e){ $('cal').innerHTML = `<div class="err">${t('err_cal')}</div>`; }
  try{
    const [ds, cs] = await Promise.all([j('/driverstandings.json?limit=40'), j('/constructorstandings.json?limit=20')]);
    lastStandings = [ds.StandingsTable.StandingsLists[0], cs.StandingsTable.StandingsLists[0]];
    renderStandings(...lastStandings);
  }catch(e){ $('drivers').innerHTML = `<tr><td colspan="6" class="err">${t('err_st')}</td></tr>`; }
}

function nextRace(){ const now=new Date(); return races.find(r => raceTime(r) > now); }
function renderNext(){
  const r = nextRace(), box=$('next');
  if(cdTimer) clearInterval(cdTimer);
  if(!r){ box.innerHTML = `<div><div class="k">${t('season')}</div><div class="v">${t('season_over')}</div></div>`; return; }
  box.innerHTML = `<div><div class="k">${t('next_k')} ${r.round}</div><div class="v">${esc(r.raceName)}</div>
    <div class="dim">${esc(r.Circuit.circuitName)} · ${esc(r.Circuit.Location.locality)}, ${esc(r.Circuit.Location.country)} · ${raceTime(r).toLocaleString(t('locale'),{weekday:'long',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'})}</div></div>
    <div class="cd" id="cd"></div>`;
  const tick = () => { let s=Math.max(0,(raceTime(r)-new Date())/1000); const d=Math.floor(s/86400); s-=d*86400; const h=Math.floor(s/3600); s-=h*3600; const m=Math.floor(s/60); const x=Math.floor(s-m*60);
    $('cd').innerHTML = [[d,t('days')],[h,t('hours')],[m,t('minutes')],[x,t('seconds')]].map(([v,l])=>`<div><b>${String(v).padStart(2,'0')}</b><span>${l}</span></div>`).join(''); };
  tick(); cdTimer = setInterval(tick, 1000);
}
function renderCal(){
  const nx = nextRace();
  $('cal').innerHTML = races.map(r => {
    const w = winners[r.round], done = !!w, isNext = nx && nx.round===r.round;
    const right = done ? `<b style="color:${col(w.Constructor.constructorId)}">${esc(w.Driver.code||w.Driver.familyName)}</b><small>${t('winner')}</small>` : `<span class="tn">${fmtDate(raceTime(r))}</span><small>${isNext?t('nextw'):''}</small>`;
    return `<div class="race ${done?'done':''} ${isNext?'nextr':''}"><span class="r">${r.round}</span><span class="n">${esc(r.raceName.replace(' Grand Prix',''))}<small>${esc(r.Circuit.Location.locality)} · ${fmtDate(raceTime(r))}</small></span><span class="w">${right}</span></div>`;
  }).join('');
}
async function renderMap(){
  const world = await (await fetch('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json')).json();
  const land = topojson.feature(world, world.objects.countries);
  const svg = d3.select('#map'), W = 1160, H = 560;
  svg.attr('viewBox', `0 0 ${W} ${H}`);
  const proj = d3.geoNaturalEarth1().fitExtent([[10,10],[W-10,H-10]], {type:'Sphere'});
  const path = d3.geoPath(proj);
  svg.append('path').attr('d', path({type:'Sphere'})).attr('fill','#10141b');
  svg.append('path').attr('d', path(d3.geoGraticule10())).attr('fill','none').attr('stroke','#161b23');
  svg.append('g').selectAll('path').data(land.features).join('path').attr('d', path).attr('fill','#1d232d').attr('stroke','#2a313d').attr('stroke-width',.5);
  const nx = nextRace(), tip=$('tip');
  const pts = races.map(r => proj([+r.Circuit.Location.long, +r.Circuit.Location.lat]));
  svg.append('path').attr('d', d3.line().curve(d3.curveCatmullRom)(pts)).attr('fill','none').attr('stroke','rgba(225,6,0,.25)').attr('stroke-width',1.2).attr('stroke-dasharray','4 4');
  const g = svg.append('g').selectAll('g').data(races).join('g').attr('transform', (r,i) => `translate(${pts[i][0]},${pts[i][1]})`).style('cursor','pointer');
  g.each(function(r){
    const s = d3.select(this), done = !!winners[r.round], isNext = nx && nx.round===r.round;
    if(isNext){ s.append('circle').attr('r',14).attr('fill','rgba(225,6,0,.25)').append('animate').attr('attributeName','r').attr('values','8;18;8').attr('dur','2s').attr('repeatCount','indefinite'); }
    s.append('circle').attr('r', isNext?7:5.5).attr('fill', isNext?'#e10600': done?'#5d6577':'#0b0d12').attr('stroke', done&&!isNext?'none':isNext?'#fff':'#8b94a7').attr('stroke-width', isNext?2:1.6);
    s.append('text').text(r.round).attr('x', 9).attr('y', 4).attr('fill', isNext?'#fff':'#8b94a7').attr('font-size', 11).attr('font-weight', 700).attr('font-family','Titillium Web');
  });
  g.on('mousemove', (ev, r) => {
    const w = winners[r.round], box=$('map').getBoundingClientRect();
    tip.innerHTML = `<b>${r.round}. ${esc(r.raceName)}</b>${esc(r.Circuit.circuitName)}<br><span class="dim">${raceTime(r).toLocaleDateString(t('locale'),{day:'numeric',month:'long',year:'numeric'})}</span>` +
      (w ? `<br>${t('winner_l')}: <b style="display:inline;color:${col(w.Constructor.constructorId)}">${esc(w.Driver.givenName)} ${esc(w.Driver.familyName)}</b> · ${esc(tname(w.Constructor))}` : '');
    tip.style.display='block';
    const x = ev.clientX - box.left, y = ev.clientY - box.top;
    tip.style.left = Math.min(x+14, box.width-270)+'px'; tip.style.top = (y+14)+'px';
  }).on('mouseleave', () => tip.style.display='none');
}
function renderStandings(dl, cl){
  if(dl) $('afterRound').textContent = t('after')(dl.round, races.length || '?');
  const D = dl ? dl.DriverStandings : [], C = cl ? cl.ConstructorStandings : [];
  $('drivers').innerHTML = D.map(d => { const c = d.Constructors[d.Constructors.length-1];
    return `<tr><td class="p">${d.positionText}</td><td class="bar"><i style="background:${col(c.constructorId)}"></i></td>
      <td><b>${esc(d.Driver.givenName)} ${esc(d.Driver.familyName)}</b></td><td class="dim">${esc(tname(c))}</td><td class="num">${d.wins}</td><td class="num pts">${d.points}</td></tr>`; }).join('');
  const max = Math.max(1, ...C.map(c => +c.points));
  $('teamsTable').innerHTML = C.map(c => `<tr><td class="p">${c.positionText}</td><td><b>${esc(tname(c.Constructor))}</b></td>
      <td><div class="cbar"><div class="t"><i style="width:${(+c.points/max*100).toFixed(1)}%;background:${col(c.Constructor.constructorId)}"></i></div></div></td><td class="num pts">${c.points}</td></tr>`).join('');
  $('teams').innerHTML = C.map(c => {
    const id = c.Constructor.constructorId;
    const ds = D.filter(d => d.Constructors[d.Constructors.length-1].constructorId === id);
    return `<div class="team"><div class="top" style="border-top-color:${col(id)}"><div class="nm">${esc(tname(c.Constructor))}</div>
      <div class="meta">${t('t_meta')(c.positionText, c.points, c.wins, esc(c.Constructor.nationality))}</div></div>
      ${ds.map(d => `<div class="drv"><span class="no" style="color:${col(id)}">${esc(d.Driver.permanentNumber||'')}</span>
        <span class="who"><b>${esc(d.Driver.givenName)} ${esc(d.Driver.familyName)}</b><small>${esc(d.Driver.nationality)} · ${esc(d.Driver.code||'')}</small></span>
        <span class="pt">${d.points}<small>${t('d_meta')(d.positionText, d.wins)}</small></span></div>`).join('')}</div>`;
  }).join('');
}
$('lang').onclick = () => { LANG = LANG==='it' ? 'en' : 'it'; try{ localStorage.setItem('ftr.lang', LANG); }catch(e){} applyLang(); };
main();
</script>
