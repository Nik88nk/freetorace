<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Become a tester · Free to Race</title>
<link rel="canonical" href="https://free-to-race.com/tester/">
<link rel="icon" type="image/png" sizes="96x96" href="../img/favicon-96.png">
<link rel="icon" type="image/png" sizes="48x48" href="../img/favicon-48.png">
<meta name="description" content="Help test the Free to Race app for Android: free live timing, track map and tyre strategy. Join the group, become a tester and install it from Google Play.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0d12;--panel:#14181f;--panel2:#1b2029;--line:#262c37;--line2:#1d222b;--text:#eef1f6;--dim:#8b94a7;--dim2:#5d6577;--accent:#e10600;--green:#22d36b;--amber:#ffb020}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.6 "Titillium Web","Segoe UI",system-ui,sans-serif}
a{color:inherit}
.wrap{max-width:860px;margin:0 auto;padding:0 20px}
nav{position:sticky;top:0;z-index:10;background:rgba(8,9,13,.92);backdrop-filter:blur(8px);border-bottom:3px solid var(--accent)}
nav .wrap{display:flex;align-items:center;gap:16px;height:60px}
.brand{font-weight:900;font-size:21px;font-style:italic;text-decoration:none;display:flex;align-items:center;gap:9px}
.brand b{color:var(--accent)}
.lang{margin-left:auto;background:transparent;border:1px solid var(--line);color:var(--dim);border-radius:8px;padding:6px 10px;font:inherit;font-weight:700;cursor:pointer}
h1{font-size:clamp(34px,5vw,48px);line-height:1.05;margin:44px 0 10px;font-weight:900;font-style:italic}
.lead{font-size:20px;color:#c9cfdb;margin:0 0 30px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:20px 24px;margin:0 0 16px}
.card h2{margin:0 0 8px;font-size:22px}
.card p,.card li{color:#c9cfdb}
.card p{margin:0 0 10px}
.card ul{margin:0 0 10px;padding-left:20px}
.card li{margin:4px 0}
.step{display:flex;gap:16px;align-items:flex-start}
.num{flex:0 0 40px;height:40px;border-radius:50%;background:var(--accent);color:#fff;font-weight:900;font-size:20px;display:flex;align-items:center;justify-content:center}
.step>div{min-width:0}
.btn{display:inline-block;background:var(--accent);color:#fff;text-decoration:none;font-weight:700;border-radius:10px;padding:10px 18px;margin:4px 0 6px}
.wait{display:inline-block;border:2px dashed var(--amber);color:var(--amber);font-weight:700;border-radius:10px;padding:8px 14px;margin:4px 0 6px}
footer{color:var(--dim2);font-size:13px;padding:26px 0 40px;border-top:1px solid var(--line2);margin-top:30px}
</style>
<script data-goatcounter="https://freetorace.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
</head>
<body>
<nav><div class="wrap">
  <a class="brand" href="../"><img src="../img/logo.png" alt="" style="width:30px;height:30px"><span><b>FREE</b> TO RACE</span></a>
  <button class="lang" id="lang"></button>
</div></nav>
<main class="wrap" id="page"></main>
<script>
// Da riempire quando ci sono (vuoto = riquadro «in arrivo»):
const GROUP_URL = '';   // Gruppo Google dei tester, es. https://groups.google.com/g/freetorace-testers
const OPTIN_URL = '';   // link di partecipazione al test chiuso (Play Console → Test chiusi → Tester), dopo l'approvazione di Google
const PLAY_URL = 'https://play.google.com/store/apps/details?id=com.freetorace.app';

const link = (url, text, ev) => url
  ? `<a class="btn" href="${url}" target="_blank" rel="noopener" data-ev="${ev}">${text}</a>`
  : `<span class="wait">${LANG==='it' ? 'Disponibile dopo l’approvazione di Google' : 'Available after Google’s approval'}</span>`;

const T = {
en: () => `
<h1>Become a tester</h1>
<p class="lead">Free to Race is coming to Google Play. Before it can be public, Google asks that a group of people use it for 14 days. Help us get there.</p>
<div class="card"><h2>Who we are looking for</h2>
<p>F1 fans with an Android phone. No technical skills needed.</p></div>
<div class="card"><h2>What we ask</h2>
<ul>
<li>Install the app and keep it for <b>14 days</b>.</li>
<li>Open it during race weekends: practice, qualifying, the race.</li>
<li>Tell us what does not work or could be better: <a href="mailto:segnalazioni@free-to-race.com">segnalazioni@free-to-race.com</a>.</li>
</ul>
<p>The app is free, needs no account and shows no ads.</p></div>
<div class="card step"><span class="num">1</span><div><h2>Join the group</h2>
<p>A Google group used only to give testers access. You receive no emails.</p>
${link(GROUP_URL, 'Join the group', 'tester-group')}</div></div>
<div class="card step"><span class="num">2</span><div><h2>Become a tester</h2>
<p>Open the test page with the same Google account and press “Become a tester”.</p>
${link(OPTIN_URL, 'Become a tester', 'tester-optin')}</div></div>
<div class="card step"><span class="num">3</span><div><h2>Install it from Google Play</h2>
<p>From the test page, or search for “Free to Race” on Google Play with the same account.</p>
${link(OPTIN_URL ? PLAY_URL : '', 'Open in Google Play', 'tester-play')}</div></div>
<div class="card"><h2>iPhone or computer?</h2>
<p>Nothing to test there: open <a href="../live/">free-to-race.com/live</a> in the browser and add it to the home screen, or download the program for Windows from the <a href="../">home page</a>.</p></div>
<footer>Unofficial fan project, not associated in any way with the Formula 1 companies. F1, FORMULA ONE, FORMULA 1, GRAND PRIX and related marks are trade marks of Formula One Licensing B.V.</footer>`,
it: () => `
<h1>Diventa tester</h1>
<p class="lead">Free to Race sta arrivando su Google Play. Prima di renderla pubblica, Google chiede che un gruppo di persone la usi per 14 giorni. Aiutaci ad arrivarci.</p>
<div class="card"><h2>Chi cerchiamo</h2>
<p>Appassionati di F1 con un telefono Android. Non servono competenze tecniche.</p></div>
<div class="card"><h2>Cosa ti chiediamo</h2>
<ul>
<li>Installa l’app e tienila per <b>14 giorni</b>.</li>
<li>Aprila durante i weekend di gara: prove libere, qualifica, gara.</li>
<li>Scrivici cosa non funziona o si può migliorare: <a href="mailto:segnalazioni@free-to-race.com">segnalazioni@free-to-race.com</a>.</li>
</ul>
<p>L’app è gratuita, senza account e senza pubblicità.</p></div>
<div class="card step"><span class="num">1</span><div><h2>Unisciti al gruppo</h2>
<p>Un gruppo Google che serve solo a dare l’accesso ai tester. Non ricevi email.</p>
${link(GROUP_URL, 'Unisciti al gruppo', 'tester-group')}</div></div>
<div class="card step"><span class="num">2</span><div><h2>Diventa tester</h2>
<p>Apri la pagina del test con lo stesso account Google e premi «Diventa un tester».</p>
${link(OPTIN_URL, 'Diventa tester', 'tester-optin')}</div></div>
<div class="card step"><span class="num">3</span><div><h2>Installala da Google Play</h2>
<p>Dalla pagina del test, oppure cerca «Free to Race» su Google Play con lo stesso account.</p>
${link(OPTIN_URL ? PLAY_URL : '', 'Apri in Google Play', 'tester-play')}</div></div>
<div class="card"><h2>Hai un iPhone o un computer?</h2>
<p>Lì non c’è niente da provare: apri <a href="../live/">free-to-race.com/live</a> nel browser e aggiungila alla schermata Home, oppure scarica il programma per Windows dalla <a href="../">pagina principale</a>.</p></div>
<footer>Progetto di appassionati non ufficiale, non associato in alcun modo alle società di Formula 1. F1, FORMULA ONE, FORMULA 1, GRAND PRIX e i marchi collegati appartengono a Formula One Licensing B.V.</footer>`};
let LANG = (()=>{ try{ const s=localStorage.getItem('ftr.lang'); if(s==='it'||s==='en') return s; }catch(e){} return /^it\b/i.test(navigator.language||'') ? 'it' : 'en'; })();
function show(){
  document.documentElement.lang = LANG;
  document.getElementById('page').innerHTML = T[LANG]();
  document.getElementById('lang').textContent = LANG==='it' ? 'EN' : 'IT';
  document.title = LANG==='it' ? 'Diventa tester · Free to Race' : 'Become a tester · Free to Race';
}
document.addEventListener('click', e => {
  // contatore senza cookie (GoatCounter, aggiunto da build_sito.py): solo quante volte si preme un pulsante
  const ev = e.target.closest('[data-ev]');
  if(ev && window.goatcounter && goatcounter.count) goatcounter.count({path: ev.dataset.ev, title: ev.dataset.ev, event: true});
});
document.getElementById('lang').onclick =() => { LANG = LANG==='it' ? 'en' : 'it'; try{ localStorage.setItem('ftr.lang', LANG); }catch(e){} show(); };
show();
</script>
</body>
</html>
